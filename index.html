<!-- INTRO VIDEO OVERLAY（遷入形式參照 final原型結構ASstudio首頁_standalone.html 的做法：
     全螢幕影片覆蓋層，播完（或發生錯誤/逾時保險）就淡出移除，讓底下的網站內容顯露出來） -->
<div id="sc-intro-overlay" style="position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; align-items:center; justify-content:center; transition:opacity 0.6s ease;">
  <video id="sc-intro-video" autoplay muted playsinline preload="auto" style="width:100%; height:100%; object-fit:cover;">
    <source src="uploads/網頁前導片.mp4" type="video/mp4">
  </video>
</div>
<script>
(function () {
  var overlay = document.getElementById('sc-intro-overlay');
  var vid = document.getElementById('sc-intro-video');
  if (!overlay || !vid) return;

  // 開場影片只在「真正從瀏覽器進入網站」時播一次：用 sessionStorage 記一個
  // 「這個分頁這次工作階段已經播過」的旗標，只要旗標存在，不管是點子頁連結
  // 回首頁、按瀏覽器上一頁（不管有沒有吃到 bfcache）、或重新整理，一律不重播。
  // 分頁關閉、或使用者直接開新分頁進站，sessionStorage 會是空的，才會再播一次。
  var SESSION_KEY = 'sc_introPlayed';
  try {
    if (sessionStorage.getItem(SESSION_KEY)) {
      overlay.remove();
      return;
    }
    sessionStorage.setItem(SESSION_KEY, '1');
  } catch (err) {
    // sessionStorage 被瀏覽器封鎖（例如嚴格隱私模式）時，退回用 referrer 判斷：
    // 同網域、且不是首頁自己，視為從站內子頁過來，一樣不播。
    try {
      if (document.referrer) {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin && ref.pathname !== location.pathname) {
          overlay.remove();
          return;
        }
      }
    } catch (err2) {}
  }

  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    overlay.style.opacity = '0';
    setTimeout(function () { overlay.remove(); }, 600);
  }

  vid.addEventListener('ended', reveal);
  // 影片無法播放（格式不支援、載入失敗等）就直接顯露頁面，不要卡住
  vid.addEventListener('error', reveal);
  // 保險：萬一瀏覽器封鎖自動播放、ended/error 都沒觸發，逾時也要顯露頁面
  setTimeout(reveal, 15000);
})();
</script>

  componentDidMount() {
    this._onDocMouseDown = (e) => {
      const inBox = e.target && e.target.closest && e.target.closest('[data-search-box]');
      // Clicking anywhere except the search box closes the suggestion list.
      if (!inBox && this.state.searchResults.length) this.setState({ searchResults: [] });
      // ...and dismisses (fades out) an active flash highlight — desktop only.
      // 手機版（2026-07-31 修正）不再這樣做：黃色標註現在代表「球體正釘在
      // 這個節點上」，使用者拖曳/縮放球體本來就會點在 [data-search-box] 以外
      // 的地方，如果沿用桌機這套「點框外就淡出」的邏輯，只要一開始拖曳旋轉
      // 就會立刻把標註滅掉，跟「保持黃色標註」的需求直接衝突。手機版現在
      // 只有搜尋到新節點（goToNode() 換了 flashId）才會讓標註换位置，不會
      // 無故消失。
      if (!inBox && this.state.flashId != null && this.state.viewportW >= 768) this.dismissFlash();
      const inMenu = e.target && e.target.closest && e.target.closest('[data-menu-box]');
      if (!inMenu && this.state.showMaterialMenu) this.setState({ showMaterialMenu: false });
    };
    document.addEventListener('mousedown', this._onDocMouseDown);

    // 手機／平板適配：追蹤 viewport 寬度，驅動 renderVals() 裡的 isMobile 判斷。
    // debounce 一下，避免拖曳視窗縮放時瘋狂觸發 setState。
    this._resizeTimer = null;
    this._onResize = () => {
      if (this._resizeTimer) clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => {
        this.setState({ viewportW: window.innerWidth });
      }, 150);
    };
    window.addEventListener('resize', this._onResize);

    // 手機版 3D 球體：拖曳旋轉。掛在圓環的容器（data-globe-surface）上，用
    // Pointer Events 統一處理滑鼠／觸控。桌機（viewportW >= 768）完全不接
    // 這幾個事件的實際邏輯，只是掛著監聽器本身沒有副作用。
    //
    // ⚠️ 刻意不用 setPointerCapture()：一開始有用，但實測發現一旦在
    // pointerdown 當下 setPointerCapture 到 surface，接下來這個手勢產生的
    // pointerup／click 都會被瀏覽器整個「重新指向」到 surface 這個 <div>
    // 本身，不會再送到手指底下真正的節點（<circle>/<a>）——結果就是「輕點
    // 節點完全沒反應、連結永遠點不進去」，而且是靜止點擊也一樣壞掉，不是
    // 只有拖曳時才會這樣。改成拖曳開始後把 pointermove/pointerup 監聽器
    // 掛到 document 上（拖曳期間手指滑出 surface 範圍也還追蹤得到，效果
    // 跟 setPointerCapture 想要達到的一樣），放開後就把這兩個監聽器移除，
    // click 事件的目標元素就不會被動過手腳，點擊節點才能正常導覽到子頁。
    // 雙指縮放：_globeActivePointers 追蹤目前放在螢幕上的每根手指
    // （pointerId -> 目前座標）。一根手指＝拖曳旋轉（跟原本邏輯一樣）；兩根
    // 手指同時按著＝縮放模式，改用兩指之間的距離變化算縮放倍率，這段時間
    // 不會同時觸發旋轉，避免兩種手勢互相干擾、角度跟縮放同時亂跳。
    const surface = document.querySelector('[data-globe-surface]');
    this._onGlobePointerDown = (e) => {
      if (this.state.viewportW >= 768) return;
      this._globeActivePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this._globeActivePointers.size === 1) {
        // 使用者主動抓住球體，取消還在跑的「飛到北極點」動畫，改由手勢接管。
        this._globeFlying = false;
        this._globeDragging = true;
        this._globeVelYaw = 0;
        this._globeDragDist = 0;
        this._globeLastX = e.clientX;
        this._globeLastY = e.clientY;
        document.addEventListener('pointermove', this._onGlobePointerMove);
        document.addEventListener('pointerup', this._onGlobePointerUp);
        document.addEventListener('pointercancel', this._onGlobePointerUp);
      } else if (this._globeActivePointers.size === 2) {
        this._globeFlying = false;
        this._globePinching = true;
        this._globeDragging = false;
        const pts = Array.from(this._globeActivePointers.values());
        this._globePinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        this._globePinchStartZoom = this._globeZoom;
        // 兩指手勢結束後放開的 click 一律不當成點擊節點。
        this._globeDragDist += 999;
      }
    };
    this._onGlobePointerMove = (e) => {
      if (!this._globeActivePointers.has(e.pointerId)) return;
      this._globeActivePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (this._globePinching && this._globeActivePointers.size >= 2) {
        const pts = Array.from(this._globeActivePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const ratio = dist / this._globePinchStartDist;
        this._globeZoom = Math.max(this._GLOBE_ZOOM_MIN, Math.min(this._GLOBE_ZOOM_MAX, this._globePinchStartZoom * ratio));
        this.paintGlobe();
        return;
      }

      if (!this._globeDragging) return;
      const dx = e.clientX - this._globeLastX;
      const dy = e.clientY - this._globeLastY;
      this._globeLastX = e.clientX;
      this._globeLastY = e.clientY;
      this._globeDragDist += Math.abs(dx) + Math.abs(dy);
      const sens = 0.012;
      this._globeYaw += dx * sens;
      this._globeVelYaw = dx * sens;
      // pitch 不夾限範圍（原本限制在 ±1.15 弧度內，避免手動拖曳把球體整個
      // 「翻過去」）。搜尋飛到北極點（startFlyTo()）常常需要把 pitch 轉到
      // 這個範圍以外才能把目標節點轉到畫面正上方——如果拖曳還夾在 ±1.15，
      // 飛到定位後只要使用者一伸手拖曳，pitch 會瞬間被夾回範圍內，畫面會
      // 明顯跳一下。乾脆讓拖曳跟飛行共用同一個「pitch 沒有邊界」的規則。
      this._globePitch -= dy * sens;
      this.paintGlobe();
    };
    this._onGlobePointerUp = (e) => {
      this._globeActivePointers.delete(e.pointerId);
      if (this._globeActivePointers.size < 2) this._globePinching = false;
      if (this._globeActivePointers.size === 1) {
        // 從兩指縮放收回成一根手指——把單指拖曳的基準點重設到剩下那根手指
        // 目前的位置，避免手指數量切換的瞬間角度跳一下。
        const remaining = Array.from(this._globeActivePointers.values())[0];
        this._globeLastX = remaining.x;
        this._globeLastY = remaining.y;
        this._globeDragging = true;
      } else if (this._globeActivePointers.size === 0) {
        this._globeDragging = false;
        document.removeEventListener('pointermove', this._onGlobePointerMove);
        document.removeEventListener('pointerup', this._onGlobePointerUp);
        document.removeEventListener('pointercancel', this._onGlobePointerUp);
      }
    };
    // 拖曳距離超過一點點門檻，放開時視為「在轉球體/縮放」而不是「點節點」，
    // 攔截緊接在後面的 click，避免拖曳結束時誤觸連結跳轉到子頁。
    this._onGlobeClickCapture = (e) => {
      if (this._globeDragDist > 6) {
        e.preventDefault();
        e.stopPropagation();
      }
    };
    if (surface) {
      surface.addEventListener('pointerdown', this._onGlobePointerDown);
      surface.addEventListener('click', this._onGlobeClickCapture, true);
    }
    this._globeRaf = requestAnimationFrame(() => this.globeTick());
  }

  componentWillUnmount() {
    if (this._onDocMouseDown) document.removeEventListener('mousedown', this._onDocMouseDown);
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    const surface = document.querySelector('[data-globe-surface]');
    if (surface) {
      surface.removeEventListener('pointerdown', this._onGlobePointerDown);
      surface.removeEventListener('click', this._onGlobeClickCapture, true);
    }
    document.removeEventListener('pointermove', this._onGlobePointerMove);
    document.removeEventListener('pointerup', this._onGlobePointerUp);
    document.removeEventListener('pointercancel', this._onGlobePointerUp);
    if (this._globeRaf) cancelAnimationFrame(this._globeRaf);
    if (this._resizeTimer) clearTimeout(this._resizeTimer);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._fadeTimer) clearTimeout(this._fadeTimer);
    if (this._flash) this._flash.remove();
    if (this._tri) this._tri.remove();
    if (this._pinLineSvg) this._pinLineSvg.remove();
    if (this._pinLink) this._pinLink.remove();
  }

  goToNode(id) {
    if (this._fadeTimer) { clearTimeout(this._fadeTimer); this._fadeTimer = null; }
    this._dismissing = false;
    this.setState({ flashId: id, hoveredId: id, searchResults: [] });
    this.ensureFlash();
    this.ensureTriangle();
    this.startFlash(id);
    // 手機版 3D 球體：把搜到的節點飛轉到北極點固定住，其餘節點照常繞著這個
    // 軸自轉（見 startFlyTo()/computeSpherePoseFor() 的說明）。桌機是平面
    // 2D 圓環，沒有這個旋轉系統，不受影響。
    if (this.state.viewportW < 768) {
      this.startFlyTo(id);
      // 手機版地標 icon＋虛線（見 ensureLandmark()）：只在手機版顯示，桌機
      // 的節點本來就都能直接點，不需要這個額外的導覽入口。
      const node = this.nodeData.find(d => d.id === id);
      this.ensureLandmark();
      if (node && this._pinLink) {
        this._pinLink.href = node.href;
        if (this._pinLinkLabel) this._pinLinkLabel.textContent = node.name;
      }
      // 重新記錄成長動畫的起始時間，讓虛線每次搜尋定位都重新「長出來」一次，
      // 就算上一次的虛線還沒完全淡出也一樣重新播放。
      this._pinGrowStart = performance.now();
    }
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = requestAnimationFrame(() => this.tick());
  }

  ensureFlash() {
    // Solid yellow circle. Body-appended (outside the DC template) so the
    // runtime's per-frame re-render can't reset its inline styles. z-index:1
    // sits ABOVE the opaque page background but BELOW the diagram (the #works
    // section is given z-index:2), so it never covers any graph element.
    if (this._flash && document.body.contains(this._flash)) return this._flash;
    const f = document.createElement('div');
    f.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:1; display:none; opacity:0; transition:opacity 0.45s ease; filter:blur(4px);';
    document.body.appendChild(f);
    this._flash = f;
    return f;
  }

  ensureTriangle() {
    // Flat isosceles triangle that points at an off-screen target. Sits above
    // the graph (but below the header) so it's always visible at the edge.
    if (this._tri && document.body.contains(this._tri)) return this._tri;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:950; opacity:0; pointer-events:none; transition:opacity 0.45s ease;';
    const rot = document.createElement('div');
    rot.style.transform = 'rotate(0deg)';
    const pulse = document.createElement('div');
    pulse.style.cssText = 'animation: arrowPulse 0.9s ease-in-out infinite;';
    const tri = document.createElement('div');
    // Wide, short isosceles triangle pointing right.
    tri.style.cssText = 'width:52px; height:26px; background:#FFD400; clip-path:polygon(0% 0%, 0% 100%, 100% 50%); filter:drop-shadow(0 2px 5px rgba(0,0,0,0.35));';
    pulse.appendChild(tri);
    rot.appendChild(pulse);
    wrap.appendChild(rot);
    document.body.appendChild(wrap);
    this._tri = wrap;
    this._triRot = rot;
    return wrap;
  }

  // 手機版搜尋定位後，標註點正上方的虛線＋地標 icon：讓使用者除了點小小的
  // 圓點本身，還有一個大很多、明顯是「可以點」的目標可以進入子頁。虛線用
  // 一個蓋滿整個畫面的 <svg>（跟 flash/triangle 一樣是原生 DOM、不透過樣板，
  // 理由相同——見上面 field 宣告處的說明）裝一條 <line>，pathLength="1" 讓
  // stroke-dasharray/dashoffset 可以用 0~1 的比例表示「畫了多少」，不用管
  // 線實際多長；地標 icon 是一個真正的 <a href>，讓既有的頁面轉場腳本
  // （document 上監聽 a[href$=".dc.html"] 的那段）可以直接處理點擊導覽，
  // 不用另外重寫一套轉場邏輯。
  ensureLandmark() {
    if (this._pinLineSvg && document.body.contains(this._pinLineSvg)) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('style', 'position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; opacity:0; transition:opacity 0.3s ease;');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('pathLength', '1');
    // 顏色（黑／金）在 tick() 裡依 isDarkMode 動態設定，這裡先給個預設值。
    line.setAttribute('stroke', '#000000');
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-dasharray', '0.06 0.05');
    line.style.animation = 'dashFlow 0.6s linear infinite';
    line.style.filter = 'drop-shadow(0 1px 2px rgba(0,0,0,0.35))';
    svg.appendChild(line);
    document.body.appendChild(svg);
    this._pinLineSvg = svg;
    this._pinLineEl = line;

    const a = document.createElement('a');
    a.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-100%); z-index:951; display:flex; opacity:0; pointer-events:none; transition:opacity 0.3s ease; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.4));';
    // 純線條、不填色的地標 icon（跟頁首搜尋/漢堡選單那些線條 icon 同一種
    // 風格）——顏色用 currentColor，跟著 tick() 裡設在 <a> 上的 color 走。
    a.innerHTML = '<svg width="30" height="38" viewBox="0 0 24 32" fill="none" stroke="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" stroke-width="2"></path><circle cx="12" cy="12" r="4.3" stroke-width="2"></circle></svg>';
    const label = document.createElement('div');
    label.style.cssText = 'position:absolute; width:1px; height:1px; overflow:hidden; opacity:0;';
    a.appendChild(label);
    document.body.appendChild(a);
    this._pinLink = a;
    this._pinLinkLabel = label;
  }

  startFlash(id) {
    const f = this._flash;
    const dot = document.querySelector('[data-dot="' + id + '"]');
    if (!f || !dot) return;
    const dr = dot.getBoundingClientRect();
    const clickedR = Math.max(dr.width, dr.height) / 2;
    let maxR = clickedR;
    document.querySelectorAll('[data-dot]').forEach(d => {
      const w = d.getBoundingClientRect().width / 2;
      if (w > maxR) maxR = w;
    });
    // Solid disc a bit larger than the biggest dot; soft edge via a radial
    // gradient that stays solid then fades right at the rim.
    const flashR = Math.max(clickedR * 2.2, maxR + 16);
    f.style.width = f.style.height = (flashR * 2) + 'px';
    f.style.webkitMaskImage = 'none';
    f.style.maskImage = 'none';
    f.style.background = 'radial-gradient(circle, rgba(255,208,0,0.95) 22%, rgba(255,208,0,0.6) 48%, rgba(255,208,0,0.25) 70%, rgba(255,208,0,0) 100%)';
    f.style.display = 'block';
  }

  dismissFlash() {
    this._dismissing = true;
    const f = this._flash, t = this._tri, pl = this._pinLineSvg, pin = this._pinLink;
    if (f) f.style.opacity = '0';
    if (t) t.style.opacity = '0';
    if (pl) pl.style.opacity = '0';
    if (pin) pin.style.opacity = '0';
    if (this._fadeTimer) clearTimeout(this._fadeTimer);
    this._fadeTimer = setTimeout(() => {
      if (this._raf) cancelAnimationFrame(this._raf);
      this._raf = null;
      if (f) f.style.display = 'none';
      if (pin) pin.style.display = 'none';
      this.setState({ flashId: null, hoveredId: null });
    }, 480);
  }

  tick() {
    const id = this.state.flashId;
    if (id == null) return;
    const dot = document.querySelector('[data-dot="' + id + '"]');
    if (dot) {
      const dr = dot.getBoundingClientRect();
      const cxp = dr.left + dr.width / 2;
      const cyp = dr.top + dr.height / 2;
      // 52px 邊界對窄螢幕來說占比太大，手機版縮小邊界到 16px，避免節點被誤判
      // 「太靠邊」而顯示三角形指示、不顯示黃色亮點。目前手機版容器本來就縮得
      // 比 viewport 小很多（見 renderVals() 的 diagramContainerWidth），所有
      // 116 個節點都落在安全範圍內，但仍保留這個較小邊界作為未來調整的緩衝。
      const isMobileTick = window.innerWidth < 768;
      const vw = window.innerWidth, vh = window.innerHeight, margin = isMobileTick ? 16 : 52;
      const inView = cxp >= margin && cxp <= vw - margin && cyp >= margin && cyp <= vh - margin;
      // Circle rides the dot.
      if (this._flash) {
        this._flash.style.left = cxp + 'px';
        this._flash.style.top = cyp + 'px';
      }
      // Triangle clamps to the screen edge, rotated toward the dot.
      if (this._tri) {
        const angle = Math.atan2(cyp - vh / 2, cxp - vw / 2);
        this._tri.style.left = Math.max(margin, Math.min(vw - margin, cxp)) + 'px';
        this._tri.style.top = Math.max(margin, Math.min(vh - margin, cyp)) + 'px';
        this._triRot.style.transform = 'rotate(' + (angle * 180 / Math.PI) + 'deg)';
      }
      // Cross-fade triangle <-> circle as the dot enters/leaves the viewport.
      if (!this._dismissing) {
        if (this._flash) this._flash.style.opacity = inView ? '1' : '0';
        if (this._tri) this._tri.style.opacity = inView ? '0' : '1';
      }

      // 手機版地標 icon＋虛線：只在手機版、標註點在畫面內時顯示，跟著 dot
      // 的即時螢幕座標更新（globe 每影格都在動，這裡本來就已經是每影格重新
      // 量測 dot 位置的迴圈，順便一起更新最省事）。桌機沒有這組元素可更新
      // （ensureLandmark() 只在 goToNode() 手機分支才會呼叫），這幾個 if
      // 自然是 no-op。
      if (this._pinLineSvg && this._pinLink) {
        const showPin = isMobileTick && inView && !this._dismissing;
        if (showPin) {
          const dotR = Math.max(dr.width, dr.height) / 2;
          const lineLen = dotR + 60;
          // 虛線向上延伸的「長出來」動畫：搜尋定位後 380ms 內從 0 長到全長，
          // 之後維持全長，靠 CSS 的 dashFlow 關鍵影格做持續流動的虛線效果。
          const growMs = 380;
          const g = this._pinGrowStart ? Math.min(1, (performance.now() - this._pinGrowStart) / growMs) : 1;
          const eased = 1 - Math.pow(1 - g, 3);
          const startY = cyp - dotR;
          const endY = startY - lineLen * eased;
          // 淺色模式黑線、深色模式金線（跟 specialColor 深色模式用的金色是
          // 同一個色號）——不是黃色亮點那種填色強調，純粹線條，所以每影格
          // 直接依目前 isDarkMode 設定顏色，深色模式切換當下也會立刻跟著換。
          const pinColor = this.state.isDarkMode ? '#BDA434' : '#000000';
          this._pinLineEl.setAttribute('x1', cxp);
          this._pinLineEl.setAttribute('y1', startY);
          this._pinLineEl.setAttribute('x2', cxp);
          this._pinLineEl.setAttribute('y2', endY);
          this._pinLineEl.setAttribute('stroke', pinColor);
          this._pinLineSvg.style.opacity = String(eased);
          this._pinLink.style.left = cxp + 'px';
          this._pinLink.style.top = endY + 'px';
          this._pinLink.style.opacity = String(eased);
          this._pinLink.style.color = pinColor;
          this._pinLink.style.pointerEvents = eased > 0.6 ? 'auto' : 'none';
        } else {
          this._pinLineSvg.style.opacity = '0';
          this._pinLink.style.opacity = '0';
          this._pinLink.style.pointerEvents = 'none';
        }
      }
    }
    this._raf = requestAnimationFrame(() => this.tick());
  }

  // 每個節點的連線數，決定圓點大小（degree 越高，圓點越大）。
  computeDegree() {
    const degree = {};
    this.nodeData.forEach(d => { degree[d.id] = 0; });
    this.edgeData.forEach(([a, b]) => {
      if (a in degree) degree[a]++;
      if (b in degree) degree[b]++;
    });
    return degree;
  }

  // 依連線數算出的圓點半徑（viewBox 單位，未乘 dotScale），桌機 2D 圓環、
  // 手機 3D 球體都用同一份數字，而且 paintGlobe() 這種在 renderVals() 之外
  // 單獨跑的方法也需要用到，所以算過一次就記住，不用每次重算。
  computeNodeRadiusMap() {
    if (this._nodeRadiusMap) return this._nodeRadiusMap;
    const degree = this.computeDegree();
    const maxDegree = Math.max(1, ...Object.values(degree));
    const rMin = 4, rMax = 24;
    const map = {};
    this.nodeData.forEach(d => {
      map[d.id] = rMin + (degree[d.id] / maxDegree) * (rMax - rMin);
    });
    this._nodeRadiusMap = map;
    return map;
  }

  // 手機版 3D 球體：把 116 個節點分布在單位球面上（Fibonacci sphere 演算法
  // ——黃金角讓「連續索引」在球面上均勻散開，緯度靠索引線性決定高度，經度靠
  // 黃金角螺旋決定角度）。旋轉只會轉動這些點的「觀察角度」，點跟點之間的
  // 相對位置（也就是資料結構本身）不會變。這份配置不依賴旋轉角度，算一次
  // 記住即可。
  //
  // specialIds（章/成/法/構等 11 個分類大標節點）跟其餘 105 個一般節點，
  // 分成兩組各自獨立跑一次 Fibonacci sphere 公式，不是全部 116 個共用同一
  // 組連續索引（2026-07-31 修正——使用者回報「大標題」在球面上擠成一團）。
  //
  // ⚠️ 一開始的修法是錯的，記錄一下避免以後重踩：曾經試過「全部共用同一組
  // 116 個索引，但保留 11 個平均間隔（每 116/11≈10.5 個位置一個）的槽位給
  // specialIds」——緯度（y）確實變均勻了（線性函數，索引平均分佈，y 自然
  // 平均分佈），但經度（theta = 黃金角 × 索引）完全沒有均勻分佈：黃金角
  // 「相鄰索引分散」的性質只在**間隔為 1** 的連續索引上成立，間隔約 10.5
  // 的索引之間，theta 每次只增加「黃金角×10.5 mod 360°」這一個固定的小
  // 角度（實測約 3.8°），11 個點的 theta 全部擠在 0°~103° 這一小段裡，
  // 反而比原本更集中在經度方向。用 Playwright 直接讀 `computeSphereUnits()`
  // 的原始座標驗證過這個問題，不是肉眼猜的。
  //
  // 正確做法：specialList、regularList 各自從 i=0 開始，各自代入自己那組
  // 的 n（11、105）算 Fibonacci sphere——黃金角「連續索引均勻散開全球面」
  // 的性質對任何 n 都成立，兩組各自單獨看都會均勻覆蓋整個球面（緯度、經度
  // 都均勻），疊在同一顆球上自然不會擠成一團。desktop 的 2D 圓環排版完全
  // 不受影響（那邊沒有呼叫這個方法，走的是自己的 arc-walk 邏輯）。
  computeSphereUnits() {
    if (this._sphereUnits) return this._sphereUnits;
    const specialSet = new Set(this.specialIds);
    const specialList = this.nodeData.filter(d => specialSet.has(d.id));
    const regularList = this.nodeData.filter(d => !specialSet.has(d.id));
    const units = {};
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    const placeGroup = (list) => {
      const n = list.length;
      list.forEach((d, i) => {
        const y = n > 1 ? 1 - (i / (n - 1)) * 2 : 0;
        const rAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = goldenAngle * i;
        units[d.id] = { x: Math.cos(theta) * rAtY, y, z: Math.sin(theta) * rAtY };
      });
    };
    placeGroup(specialList);
    placeGroup(regularList);
    this._sphereUnits = units;
    return units;
  }

  // 把一個點依給定的 yaw（繞垂直軸）／pitch（繞水平軸）旋轉，回傳旋轉後的
  // 座標——純粹的旋轉「原語」，不管傳進來的是原始球面座標還是已經被校準層
  // 轉過一次的中間結果，都可以用同一個函式再轉一次（見 projectUnit()）。
  rotateProject(u, yaw, pitch) {
    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    const x1 = u.x * cosY + u.z * sinY;
    const z1 = -u.x * sinY + u.z * cosY;
    const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
    const y2 = u.y * cosP - z1 * sinP;
    const z2 = u.y * sinP + z1 * cosP;
    return { x: x1, y: y2, z: z2 };
  }

  // 把一個節點的原始球面座標投影成目前該畫在螢幕上的座標，套用兩層旋轉：
  // 先套「校準層」（_globeBaseYaw/_globeBasePitch，搜尋定位後固定不變），
  // 再套「自轉層」（_globeYaw/_globePitch，拖曳/閒置自轉持續改變）。z 是
  // 「面向使用者的程度」（+1 正對螢幕、-1 在球體背面），用來算深度相關的
  // 大小/透明度/文字顯示與否。沒有搜尋定位過的話 base 是 (0,0)，這一步是
  // 恆等變換，效果跟只套自轉層完全一樣（向下相容）。
  projectUnit(u) {
    const aligned = (this._globeBaseYaw === 0 && this._globeBasePitch === 0)
      ? u
      : this.rotateProject(u, this._globeBaseYaw, this._globeBasePitch);
    return this.rotateProject(aligned, this._globeYaw, this._globePitch);
  }

  // 解出一組 (yaw, pitch)，讓 rotateProject(該節點的球面座標, yaw, pitch)
  // 剛好落在 (0,-1,0)——畫面正中央「上方」、y 軸上的「北極點」（SVG 的 y
  // 座標往下遞增，screenY = cy + p.y·球半徑，所以 p.y=-1 對應畫面上緣，
  // 不是 +1；p.y=+1 會是「南極點」，落在畫面下緣）。
  //
  // ⚠️ 這組角度只能拿來當「校準層」（_globeBaseYaw/_globeBasePitch）用，
  // 不能直接疊到自轉層上：yaw 是繞 y 軸轉，「y 軸上的點不會因為 yaw 改變
  // 而移動」這件事，只在該點本身的座標滿足 x=z=0 時才成立——而這裡算出來
  // 的 (yaw,pitch) 只保證「這個節點被轉到 x=z=0、y=-1 的那一刻」，如果直接
  // 把這組角度當成之後會持續變動的自轉角度基準，节点球面座標一開始 x,z
  // 通常都不是 0，繼續改變角度時它就會沿著一個小緯度圈慢慢飄走，不會真的
  // 釘住（實測過，飄移約 10px／1.5 秒，不是完全靜止）。正確用法是當成
  // projectUnit() 的「校準層」：先用這組角度把目標點轉到北極點，之後的
  // 自轉層在「已經轉過校準層」的座標系裡對北極點做 yaw 旋轉，這時候北極點
  // 座標確實是 x=z=0，旋轉不動的性質才會成立。
  //
  // 推導：先選 yaw 讓旋轉後的 x 分量歸零（x1 = u.x·cosYaw + u.z·sinYaw = 0
  // 的其中一組解），再選 pitch 把剩下的 (y1,z1)（此時已經是單位向量）轉到
  // (-1,0)——先算出轉到 (1,0) 的角度，再加 π 剛好翻到反向。
  computeSpherePoseFor(nodeId) {
    const u = this.computeSphereUnits()[nodeId];
    if (!u) return null;
    const yaw0 = (Math.abs(u.x) < 1e-9 && Math.abs(u.z) < 1e-9) ? 0 : Math.atan2(-u.x, u.z);
    const x1 = u.x * Math.cos(yaw0) + u.z * Math.sin(yaw0);
    const z1 = -u.x * Math.sin(yaw0) + u.z * Math.cos(yaw0);
    const y1 = u.y;
    const pitch0 = Math.atan2(-z1, y1) + Math.PI;
    return { yaw: yaw0, pitch: pitch0 };
  }

  // 開始「飛到北極點」的補間動畫：把「校準層」（_globeBaseYaw/
  // _globeBasePitch）從目前值動畫到 computeSpherePoseFor() 算出的目標角度，
  // globeTick() 每影格推進；同時把「自轉層」的上下傾斜（_globePitch）一併
  // 補間回 0，讓飛到定位那一刻目標節點剛好落在畫面正上方置中，不會被飛行
  // 前使用者留下的傾斜角度帶偏。左右自轉（_globeYaw）完全不受影響、飛行中
  // 維持原樣繼續轉——反正自轉層是疊加在校準層「之上」的，北極點在校準後
  // 的座標系裡本來就是 x=z=0，yaw 轉多少都不影響它，不需要在飛行時特地
  // 暫停或歸零。base 角度會先換算成跟目前角度差距最小的等效角度（因為
  // 角度會一直累加、可能已經轉了很多圈），確保動畫走最短路徑，不會憑空
  // 多繞好幾圈或轉錯方向。
  startFlyTo(nodeId) {
    const pose = this.computeSpherePoseFor(nodeId);
    if (!pose) return;
    this._globeDragging = false;
    this._globeVelYaw = 0;
    const TWO_PI = Math.PI * 2;
    const kYaw = Math.round((this._globeBaseYaw - pose.yaw) / TWO_PI);
    const kPitch = Math.round((this._globeBasePitch - pose.pitch) / TWO_PI);
    this._globeFlyStartBaseYaw = this._globeBaseYaw;
    this._globeFlyStartBasePitch = this._globeBasePitch;
    this._globeFlyTargetBaseYaw = pose.yaw + kYaw * TWO_PI;
    this._globeFlyTargetBasePitch = pose.pitch + kPitch * TWO_PI;
    this._globeFlyStartSpinPitch = this._globePitch;
    this._globeFlyStartTime = performance.now();
    this._globeFlying = true;
  }

  // 算出手機版球體上每個節點「這一影格」該畫在哪、多大、標籤要不要顯示。
  // renderVals()（決定樣板初次/常規渲染的內容）跟 paintGlobe()（拖曳/慣性
  // 旋轉時繞過 setState、直接寫 DOM 屬性的高頻更新）共用同一份幾何計算，
  // 避免兩邊算法兜不起來、旋轉到一半又被另一邊的舊數字蓋回去。
  buildGlobeGeometry() {
    const cx = 450, cy = 450;
    // 雙指縮放：_globeZoom 乘進球半徑，等於整顆球（含節點大小、字級、標籤
    // 偏移）依同一個倍率放大/縮小，維持縮放時的視覺比例一致。
    const sphereR = this._GLOBE_SPHERE_RADIUS_VB * this._globeZoom;
    const baseFontSize = this._GLOBE_BASE_FONT_SIZE;
    const units = this.computeSphereUnits();
    const nodeRadiusMap = this.computeNodeRadiusMap();
    const zoom = this._globeZoom;
    const geo = {};
    this.nodeData.forEach(d => {
      const p = this.projectUnit(units[d.id]);
      // depthT: 0 = 球體最遠端、1 = 正對螢幕最近端。
      const depthT = (p.z + 1) / 2;
      const scale = (0.5 + depthT * 0.8) * zoom;
      const baseR = nodeRadiusMap[d.id] * this.dotScale;
      const r = baseR * scale;
      const screenX = cx + p.x * sphereR;
      const screenY = cy + p.y * sphereR;
      const isRight = p.x >= 0;
      const fontSize = Math.round(baseFontSize * Math.min(1.25, Math.max(0.8, scale)));
      const labelGap = 12 * zoom;
      const labelPointX = screenX + (isRight ? 1 : -1) * (r + labelGap);
      const isSpecial = this.specialIds.includes(d.id);
      geo[d.id] = {
        cx: screenX, cy: screenY, r, depthT, scale, isRight,
        fontSize, labelPointX, labelPointY: screenY,
        // 只給正面（面向螢幕這一側）的節點顯示文字——116 個節點的文字如果
        // 全部同時顯示在球面上，前後文字會疊成一團完全看不清楚；只顯示面向
        // 使用者這一側，效果比較接近「轉到面前才看得到標籤」的地球儀讀法。
        labelVisible: depthT > 0.72,
        hitR: Math.max(20, 30 * scale),
        // 手機版只有「章/成/法/構」這幾個分類大標節點可以點擊導覽，其餘
        // 一般節點只負責組成球體視覺，不接受點擊——見 renderVals() 裡
        // pointerEvents 的說明。
        clickable: isSpecial
      };
    });
    return geo;
  }

  // 同上，但算連線兩端點的螢幕座標跟「這條線該多透明」（越靠球體背面的連線
  // 越淡，維持「連線構成球體輪廓」的視覺，同時不會讓背面線條搶過正面內容）。
  buildGlobeEdgeGeometry() {
    const cx = 450, cy = 450;
    const sphereR = this._GLOBE_SPHERE_RADIUS_VB * this._globeZoom;
    const units = this.computeSphereUnits();
    return this.edgeData
      .map(([a, b], i) => {
        const ua = units[a], ub = units[b];
        if (!ua || !ub) return null;
        const pa = this.projectUnit(ua);
        const pb = this.projectUnit(ub);
        const avgDepth = (((pa.z + 1) / 2) + ((pb.z + 1) / 2)) / 2;
        return {
          id: 'e' + i, a, b,
          x1: cx + pa.x * sphereR, y1: cy + pa.y * sphereR,
          x2: cx + pb.x * sphereR, y2: cy + pb.y * sphereR,
          avgDepth
        };
      })
      .filter(Boolean);
  }

  // 建一次「節點 id -> DOM 元素」的對照表，讓 paintGlobe() 每一影格可以直接
  // 寫屬性，不用每次都重新 querySelector 一次全部節點/連線。因為 sc-for
  // 是用陣列索引當 React key（見 support.js 的 walkFor()），只要陣列長度、
  // 順序不變（桌機/手機兩種模式畫的都是固定 116 個節點、同樣的 edgeData），
  // 這些 DOM 元素在整個頁面生命週期裡不會被換掉，快取起來是安全的。
  _ensureGlobeElCache() {
    if (this._globeElCache) return this._globeElCache;
    const cache = { nodes: {}, edges: {} };
    this.nodeData.forEach(d => {
      const group = document.querySelector('[data-node="' + d.id + '"]');
      if (!group) return;
      cache.nodes[d.id] = {
        group,
        hit: group.querySelector('circle'),
        dot: group.querySelector('[data-dot]'),
        fo: group.querySelector('foreignObject'),
        div: group.querySelector('foreignObject div')
      };
    });
    this.edgeData.forEach((_pair, i) => {
      const id = 'e' + i;
      const el = document.querySelector('[data-edge="' + id + '"]');
      if (el) cache.edges[id] = el;
    });
    this._globeElCache = cache;
    return cache;
  }

  // 拖曳／慣性旋轉時的高頻畫面更新——刻意不呼叫 setState()，直接改 DOM
  // 屬性，理由跟 tick()/startFlash() 一樣（見上面 field 宣告處的說明）。
  paintGlobe() {
    if (this.state.viewportW >= 768) return;
    const nodeGeo = this.buildGlobeGeometry();
    const edgeGeo = this.buildGlobeEdgeGeometry();
    const cache = this._ensureGlobeElCache();

    this.nodeData.forEach(d => {
      const g = nodeGeo[d.id];
      const els = cache.nodes[d.id];
      if (!g || !els) return;
      if (els.dot) { els.dot.setAttribute('cx', g.cx); els.dot.setAttribute('cy', g.cy); els.dot.setAttribute('r', g.r); }
      if (els.hit) { els.hit.setAttribute('cx', g.cx); els.hit.setAttribute('cy', g.cy); els.hit.setAttribute('r', g.hitR); }
      const depthOpacity = 0.15 + g.depthT * 0.85;
      if (els.group) els.group.style.opacity = String(depthOpacity);
      if (els.fo) {
        const boxW = Math.max(140, d.name.length * g.fontSize + 16);
        const boxH = g.fontSize * 1.4 + 4;
        els.fo.setAttribute('x', String(g.isRight ? g.labelPointX : g.labelPointX - boxW));
        els.fo.setAttribute('y', String(g.labelPointY - boxH / 2));
        els.fo.setAttribute('width', String(boxW));
        els.fo.setAttribute('height', String(boxH));
        els.fo.style.display = g.labelVisible ? '' : 'none';
      }
      if (els.div) {
        els.div.style.fontSize = g.fontSize + 'px';
        els.div.style.textAlign = g.isRight ? 'left' : 'right';
      }
    });

    edgeGeo.forEach(e => {
      const el = cache.edges[e.id];
      if (!el) return;
      el.setAttribute('x1', String(e.x1));
      el.setAttribute('y1', String(e.y1));
      el.setAttribute('x2', String(e.x2));
      el.setAttribute('y2', String(e.y2));
      el.style.opacity = String(0.04 + e.avgDepth * 0.5);
    });
  }

  // 常駐的球體動畫迴圈：飛到北極點的動畫優先（見 startFlyTo()）；沒有在飛、
  // 也沒在拖曳時，讓拖曳當下的角速度用摩擦力慢慢衰減到 0，同時疊加一個很慢
  // 的閒置自轉，讓球體感覺「活著」而不是靜止的裝飾圖。桌機（viewportW >=
  // 768）不執行任何動作，只是每影格檢查一次，成本可以忽略。
  globeTick() {
    if (this.state.viewportW < 768) {
      if (this._globeFlying) {
        const t = Math.min(1, (performance.now() - this._globeFlyStartTime) / this._globeFlyDuration);
        // easeInOutCubic：起步/收尾慢，中段快，比等速線性補間更像「飛過去」。
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        this._globeBaseYaw = this._globeFlyStartBaseYaw + (this._globeFlyTargetBaseYaw - this._globeFlyStartBaseYaw) * eased;
        this._globeBasePitch = this._globeFlyStartBasePitch + (this._globeFlyTargetBasePitch - this._globeFlyStartBasePitch) * eased;
        this._globePitch = this._globeFlyStartSpinPitch * (1 - eased);
        if (t >= 1) {
          this._globeBaseYaw = this._globeFlyTargetBaseYaw;
          this._globeBasePitch = this._globeFlyTargetBasePitch;
          this._globePitch = 0;
          this._globeFlying = false;
        }
        this.paintGlobe();
      } else if (!this._globeDragging) {
        this._globeVelYaw *= 0.94;
        if (Math.abs(this._globeVelYaw) < 0.0006) this._globeVelYaw = 0;
        const idleSpeed = 0.0022;
        this._globeYaw += this._globeVelYaw + idleSpeed;
        this.paintGlobe();
      }
    }
    this._globeRaf = requestAnimationFrame(() => this.globeTick());
  }

  handleSearchInput(e) {
    const query = e.target.value;
    this.setState({ searchInput: query });
    if (query.trim()) {
      // 手機版現在跟桌機一樣畫出全部 116 個節點（見 renderVals()），
      // 搜尋結果不需要再依 viewport 篩掉任何節點。
      const results = this.nodeData.filter(n => n.name.toLowerCase().includes(query.toLowerCase()));
      this.setState({ searchResults: results });
    } else {
      this.setState({ searchResults: [] });
    }
  }



  renderVals() {
    // Coordinate system is chosen to be ~1 viewBox unit ≈ 1 rendered CSS px
    // for the container's typical size, so font-size / radius values below
    // read as their literal px sizes on screen (not scaled down by the SVG).
    const cx = 450, cy = 450;
    // 手機／平板適配：斷點依實測結果選定——820px 平板寬度下頁首與圓環圖都已經正常，
    // 768px 也是常見 iPad portrait 寬度，所以窄於這個值才視為手機、套用放大過的最小尺寸。
    const isMobile = this.state.viewportW < 768;
    const hoveredId = this.state.hoveredId;
    const isDarkMode = this.state.isDarkMode;
    const bgColor = isDarkMode ? 'oklch(0.15 0 0)' : 'oklch(0.99 0 0)';
    const textColor = isDarkMode ? 'oklch(0.95 0 0)' : 'oklch(0.16 0 0)';
    const lineColor = isDarkMode ? 'oklch(0.25 0 0)' : 'oklch(0.85 0 0)';
    const dotColor = isDarkMode ? 'oklch(0.95 0 0)' : 'oklch(0.16 0 0)';

    // Center title ("原型 × 未來" / "Architecture + Structure"). Mobile now
    // reuses the exact same desktop sizes — the whole ring (dots, labels,
    // title) is meant to be one uniform proportional shrink of the desktop
    // layout down to the phone's width, not a redesigned/enlarged mobile
    // variant. white-space:nowrap on the actual divs is what prevents the
    // two lines from wrapping/drifting apart in some mobile browsers.
    const titleFontSize = 62;
    const subtitleFontSize = 22;
    const titleBoxWidth = 420;
    const titleBoxX = cx - titleBoxWidth / 2;

    // Every node from column B, in spreadsheet row order. Desktop/tablet
    // lays them out on a flat 2D ring around the center ("原型 × 未來");
    // mobile (2026-07-31) instead wraps them around a draggable 3D sphere
    // (see buildGlobeGeometry()/paintGlobe() above) — same node set, same
    // connection data, same degree-based sizing, just a different projection.
    // Node size scales with its connection count (degree) either way.
    const ordered = this.nodeData;
    const nodeRadius = this.computeNodeRadiusMap();

    const relatedIds = new Set();
    if (hoveredId) {
      relatedIds.add(hoveredId);
      this.edgeData.forEach(([a, b]) => {
        if (a === hoveredId) relatedIds.add(b);
        if (b === hoveredId) relatedIds.add(a);
      });
    }

    let nodes, edges, spotlight, hasSpotlight;

    if (isMobile) {
      // --- 3D 球體（手機版）---
      const nodeGeo = this.buildGlobeGeometry();
      nodes = ordered.map(d => {
        const g = nodeGeo[d.id];
        const dimmed = hoveredId && !relatedIds.has(d.id);
        const isSpecial = this.specialIds.includes(d.id);
        const fontWeight = isSpecial ? 700 : 400;
        const isHoveredSelf = hoveredId === d.id;
        const specialColor = (!isDarkMode && isHoveredSelf) ? '#000000' : (isDarkMode ? '#BDA434' : '#9B9B9B');
        const dotFill = isSpecial ? specialColor : dotColor;
        const labelColor = isSpecial ? specialColor : textColor;
        const boxW = Math.max(140, d.name.length * g.fontSize + 16);
        const boxH = g.fontSize * 1.4 + 4;
        const depthOpacity = 0.15 + g.depthT * 0.85;
        return {
          id: d.id,
          name: d.name,
          href: d.href,
          cx: g.cx,
          cy: g.cy,
          r: g.r,
          hitR: g.hitR,
          boxX: g.isRight ? g.labelPointX : g.labelPointX - boxW,
          boxY: g.labelPointY - boxH / 2,
          boxW,
          boxH,
          textAlign: g.isRight ? 'left' : 'right',
          fontSize: g.fontSize,
          fontWeight,
          dotFill,
          labelColor,
          // 3D 球體上的文字一律水平放置，不像 2D 圓環那樣沿半徑旋轉——旋轉
          // 0 度等於不轉，跟桌機共用同一個樣板屬性。
          rotateDeg: 0,
          pivotX: g.labelPointX,
          pivotY: g.labelPointY,
          opacity: (dimmed ? 0.3 : 1) * depthOpacity,
          labelDisplay: g.labelVisible ? 'block' : 'none',
          // 手機版只有章/成/法/構這幾個分類大標節點可以點擊導覽子頁，其餘
          // 一般（小）節點只負責組成球體視覺——116 個節點擠在一顆小球上，
          // 大部分小點轉到背面時完全看不到文字，誤觸的機率很高、又點不到
          // 想要的頁面，乾脆讓它們單純不接受點擊。用 pointer-events:none
          // 蓋在最外層的 <a> 上，整個子樹（含 <a> 自己）都不會再吃到滑鼠/
          // 觸控事件。桌機不受影響，全部節點照常可以點擊。
          // 例外：目前被搜尋標註（黃色亮點）的節點一律恢復可點擊，就算它
          // 本來是不可點的小節點——搜尋定位後使用者理應能直接點這個點進
          // 子頁，不是只能點旁邊冒出來的地標 icon（見 ensureLandmark()）。
          pointerEvents: (g.clickable || d.id === this.state.flashId) ? 'auto' : 'none',
          cursorStyle: (g.clickable || d.id === this.state.flashId) ? 'pointer' : 'default',
          onEnter: () => this.setHover(d.id),
          onLeave: () => this.clearHover()
        };
      });

      edges = this.buildGlobeEdgeGeometry().map(e => {
        const dimmed = hoveredId && !(hoveredId === e.a || hoveredId === e.b);
        const depthOpacity = 0.04 + e.avgDepth * 0.5;
        return {
          id: e.id, x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2,
          opacity: dimmed ? 0.1 : depthOpacity
        };
      });

      // 球體會自轉、使用者也能拖著轉，光暈這種假設「固定朝中央」的平面裝飾
      // 效果套在會動的 3D 球體上會很奇怪（原型結構轉到背面時，光暈仍然是
      // 一條攤平的線，看起來會像穿透球體），手機版直接不畫。
      spotlight = null;
      hasSpotlight = false;
    } else {
      // --- 2D 圓環（桌機／平板，邏輯與數值完全未變）---
      const n = ordered.length;
      const dotScale = this.dotScale;
      const gapVB = 2.5;

      const diameterSum = ordered.reduce((sum, d) => sum + 2 * nodeRadius[d.id], 0);
      const circumference = diameterSum + n * gapVB;
      // Keep the ring well clear of the center "原型 × 未來" title regardless
      // of how tightly the nodes would otherwise pack.
      const radius = Math.max(circumference / (2 * Math.PI), 420);
      // Once radius is clamped up, re-derive the per-node gap so the arc walk
      // below still sums to exactly 2π·radius — otherwise the ring doesn't close.
      const effectiveGapVB = (2 * Math.PI * radius - diameterSum) / n;

      const positions = {};
      let arcPos = 0;
      ordered.forEach(d => {
        const r = nodeRadius[d.id];
        const angle = ((arcPos + r) / radius) - Math.PI / 2;
        positions[d.id] = {
          x: cx + radius * Math.cos(angle),
          y: cy + radius * Math.sin(angle),
          angle
        };
        arcPos += 2 * r + effectiveGapVB;
      });

      // Soft "spotlight" glow cast from the 原型結構 dot toward the center
      // title — same visual read as the existing connecting lines, just an
      // added faint glow layer. Narrow at the dot, widening as it reaches the
      // title so it reads as light spreading over distance.
      spotlight = null;
      const spotlightSrc = positions['r23'];
      if (spotlightSrc) {
        const dirX = cx - spotlightSrc.x, dirY = cy - spotlightSrc.y;
        const len = Math.hypot(dirX, dirY) || 1;
        const ux = dirX / len, uy = dirY / len;
        const perpX = -uy, perpY = ux;
        const coneLen = len + 170;
        const halfWidth = 230;
        const baseX = spotlightSrc.x + ux * coneLen, baseY = spotlightSrc.y + uy * coneLen;
        const leftX = baseX + perpX * halfWidth, leftY = baseY + perpY * halfWidth;
        const rightX = baseX - perpX * halfWidth, rightY = baseY - perpY * halfWidth;
        spotlight = {
          points: spotlightSrc.x + ',' + spotlightSrc.y + ' ' + leftX + ',' + leftY + ' ' + rightX + ',' + rightY,
          x1: spotlightSrc.x, y1: spotlightSrc.y, x2: baseX, y2: baseY,
          color: isDarkMode ? '#FFFFFF' : '#EDEDED',
          peakOpacity: isDarkMode ? 0.045 : 0.55
        };
      }
      hasSpotlight = !!spotlight;

      const boxH = 20;
      nodes = ordered.map(d => {
        const pos = positions[d.id];
        const r = nodeRadius[d.id];
        const gap = 20;
        const isRight = Math.cos(pos.angle) >= 0;
        const labelPointX = pos.x + Math.cos(pos.angle) * (r + gap);
        const labelPointY = pos.y + Math.sin(pos.angle) * (r + gap);
        const angleDeg = pos.angle * 180 / Math.PI;
        const rotateDeg = isRight ? angleDeg : angleDeg + 180;
        const dimmed = hoveredId && !relatedIds.has(d.id);
        const fontSize = 15;
        const isSpecial = this.specialIds.includes(d.id);
        const fontWeight = isSpecial ? 700 : 400;
        const isHoveredSelf = hoveredId === d.id;
        const specialColor = (!isDarkMode && isHoveredSelf) ? '#000000' : (isDarkMode ? '#BDA434' : '#9B9B9B');
        const dotFill = isSpecial ? specialColor : dotColor;
        const labelColor = isSpecial ? specialColor : textColor;
        // Size the box to comfortably fit the text (worst-case full-width CJK
        // glyphs) so nowrap text never overflows its box — overflow can shift
        // where the text-align anchor edge (the end nearest the node) actually
        // lands, breaking the otherwise-uniform node-to-label gap.
        const boxW = Math.max(160, d.name.length * fontSize + 20);
        return {
          id: d.id,
          name: d.name,
          href: d.href,
          cx: pos.x,
          cy: pos.y,
          r: r * dotScale,
          hitR: 26,
          boxX: isRight ? labelPointX : labelPointX - boxW,
          boxY: labelPointY - boxH / 2,
          boxW,
          boxH,
          textAlign: isRight ? 'left' : 'right',
          fontSize,
          fontWeight,
          dotFill,
          labelColor,
          rotateDeg,
          pivotX: labelPointX,
          pivotY: labelPointY,
          opacity: dimmed ? 0.3 : 1,
          labelDisplay: 'block',
          pointerEvents: 'auto',
          cursorStyle: 'pointer',
          onEnter: () => this.setHover(d.id),
          onLeave: () => this.clearHover()
        };
      });

      edges = this.edgeData
        .filter(([a, b]) => positions[a] && positions[b])
        .map(([a, b], i) => {
          const pa = positions[a], pb = positions[b];
          const dimmed = hoveredId && !(hoveredId === a || hoveredId === b);
          return {
            id: 'e' + i,
            x1: pa.x, y1: pa.y,
            x2: pb.x, y2: pb.y,
            opacity: dimmed ? 0.3 : 1
          };
        });
    }

    return {
      nodes, edges, bgColor, textColor, lineColor, dotColor, isDarkMode,
      spotlight, hasSpotlight,
      isMobile,
      headerPadding: isMobile ? '16px 16px' : '24px 40px',
      // 手機版整個頁面（最外層那個 div）改成 flex column，讓 #works 用
      // flex-grow 吃掉頁首（position:fixed，不佔 flex 空間）跟頁尾之間的
      // 剩餘高度——2026-07-31 修正，使用者回報「好像有一個框架罩住主視覺」，
      // 確認是指球體容器（data-globe-surface）本身的裁切邊界，要求上緣貼齊
      // 頁首下緣、下緣貼齊頁尾上緣。桌機/平板維持原本的 block 版面，不受影響。
      pageDisplay: isMobile ? 'flex' : 'block',
      pageFlexDirection: 'column',
      // #works 的上邊距只需要清開固定定位的頁首——用 Playwright 實測頁首
      // 實際高度是 96px（`headerPadding` 16px 上下 + 內容最高的深色模式
      // 切換鈕 44px），第一版抓 80px 短了 16px，球體裁切框上緣會被頁首蓋掉
      // 一截，改成精確的 96px，貼齊頁首下緣。不再像桌機那樣留 450px 的大量
      // 留白；下邊距歸零，讓 flex-grow 自己把剩餘空間吃滿到頁尾正上方。
      worksPaddingTop: isMobile ? '96px' : '450px',
      worksPaddingBottom: isMobile ? '0px' : '450px',
      worksDisplayMode: isMobile ? 'flex' : 'block',
      worksFlexGrow: isMobile ? '1' : '0',
      // data-globe-surface 現在是「裁切框」本身，手機版撐滿 #works 的全部
      // 高度（也就是頁首下緣到頁尾上緣這整段），球體視覺（下面新增的內層
      // `<div>`，寬高仍是原本那組 diagramContainerWidth 算出來的正方形）
      // 用 flex 置中在這個裁切框正中央——這樣裁切邊界比視覺球體本身大
      // 很多，旋轉/縮放時的安全邊界更寬，同時裁切框的上下緣精確貼齊頁首/
      // 頁尾。桌機/平板這個框跟視覺球體是同一塊大小（height:auto、
      // display:block，讓外層直接收縮包住內層的正方形），跟改動前完全一樣。
      globeSurfaceHeight: isMobile ? '100%' : 'auto',
      globeSurfaceDisplay: isMobile ? 'flex' : 'block',
      diagramContainerWidth: isMobile ? 'min(92vw, 88vh)' : 'min(90vw, 86vh)',
      globeOverflow: isMobile ? 'hidden' : 'visible',
      edgeStrokeWidth: isMobile ? 2 : 1,
      // 3D 球體用 paintGlobe() 每影格直接寫 cx/cy/r/opacity 等屬性做旋轉動畫，
      // 如果 CSS transition 還留著，每一次直接寫入都會被拖著跑 0.25s 的緩動，
      // 反而讓拖曳跟手感變得黏滯、有延遲；手機版直接關掉這兩個 transition。
      nodeTransition: isMobile ? 'none' : 'opacity 0.25s ease',
      edgeTransition: isMobile ? 'none' : 'opacity 0.25s ease, stroke 0.3s',
      // 拖曳/縮放球體時不要讓瀏覽器把手勢當成「頁面捲動/放大頁面」搶走。
      globeTouchAction: isMobile ? 'none' : 'auto',
      titleBoxX, titleBoxWidth, titleFontSize, subtitleFontSize,
      searchBoxDisplay: isMobile ? 'none' : 'flex',
      navPillGap: isMobile ? '12px' : '32px',
      navPillPadding: isMobile ? '10px 12px' : '16px 24px',
      showMobileSearchBar: isMobile && this.state.showMobileSearch,
      showMobileSearch: this.state.showMobileSearch,
      toggleMobileSearch: () => this.toggleMobileSearch(),
      closeMobileSearch: () => this.closeMobileSearch(),
      toggleDarkMode: () => this.toggleDarkMode(),
      showMaterialMenu: this.state.showMaterialMenu,
      toggleMaterialMenu: () => this.toggleMaterialMenu(),
      searchResults: this.state.searchResults.map(r => ({ id: r.id, name: r.name, go: () => this.goToNode(r.id) })),
      hasResults: this.state.searchResults.length > 0,
      searchInput: this.state.searchInput,
      handleSearchInput: (e) => this.handleSearchInput(e),
      setHover: (id) => this.setHover(id),
      goToNode: (id) => this.goToNode(id)
    };
  }
}

</script>

<!-- PAGE TRANSITION PRELOADER (homepage -> subpage) -->
<script>
(function () {
  // 快速跳字詞彙池（活頁簿1 C 欄粗體字，不含目的頁標題，由點擊的節點動態決定終點文字）
  var WORD_POOL = [
    '章architecturedesign', '原型教學', '原型原點', '原型結構', '木構造', '竹構造',
    'RC構造', '鋼構造', '成construction', '法structuredata', '構technics',
    '原型建築', '原型獲獎'
  ];
  var FLICKER_MS = 130;
  var LANDING_HOLD_MS = 550;
  var OVERLAY_BG = '#0a0a0a';
  var TEXT_COLOR = '#ffffff';
  var FADE_IN_MS = 250;

  var overlay, wordEl, navigating = false;

  function ensureOverlay() {
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:' + OVERLAY_BG + ';display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(0);transition:opacity ' + FADE_IN_MS + 'ms ease;';
    wordEl = document.createElement('span');
    wordEl.style.cssText = "font-family:'Noto Serif TC','Source Han Serif TC',serif;font-size:15px;font-weight:800;letter-spacing:.08em;color:" + TEXT_COLOR + ";white-space:nowrap;";
    overlay.appendChild(wordEl);
    document.body.appendChild(overlay);
  }

  function playAndNavigate(destinationWord, href) {
    ensureOverlay();
    overlay.style.pointerEvents = 'auto';
    wordEl.textContent = WORD_POOL[0];
    requestAnimationFrame(function () { overlay.style.opacity = '1'; });

    var sequence = WORD_POOL.concat([destinationWord]);
    var i = 0;
    function flicker() {
      wordEl.textContent = sequence[i];
      i++;
      if (i < sequence.length) {
        setTimeout(flicker, FLICKER_MS);
      } else {
        setTimeout(function () {
          try { sessionStorage.setItem('scTransitionIn', '1'); } catch (err) {}
          window.location.href = href;
        }, LANDING_HOLD_MS);
      }
    }
    flicker();
  }

  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href$=".dc.html"]');
    if (!a || navigating) return;
    var href = a.getAttribute('href');
    if (!href || /^https?:\/\//i.test(href)) return;
    e.preventDefault();
    navigating = true;
    var labelEl = a.querySelector('div');
    var destinationWord = labelEl ? labelEl.textContent.trim() : '';
    playAndNavigate(destinationWord || '原型教學', href);
  });

  // 瀏覽器上一頁按鈕修正：從子頁按「上一頁」回到首頁時，瀏覽器常會直接從
  // bfcache 還原這個頁面當時「即將跳轉」的畫面快照——也就是遮罩還蓋在畫面上、
  // 還沒滑開的那個瞬間，導致看起來像卡在前導動畫。用 pageshow 偵測 bfcache
  // 還原（event.persisted），還原時直接把遮罩清掉、重置狀態，讓首頁正常顯示。
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    navigating = false;
    if (overlay) {
      overlay.remove();
      overlay = null;
    }
  });
})();
</script>
