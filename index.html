<!-- INTRO VIDEO OVERLAY（遷入形式參照 final原型結構ASstudio首頁_standalone.html 的做法：
     全螢幕影片覆蓋層，播完（或發生錯誤/逾時保險）就淡出移除，讓底下的網站內容顯露出來） -->
<div id="sc-intro-overlay" style="position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; align-items:center; justify-content:center; transition:opacity 0.6s ease;">
  <video id="sc-intro-video" autoplay muted playsinline preload="auto" style="width:100%; height:100%; object-fit:cover;">
    <source src="uploads/網頁前導片.mp4" type="video/mp4">
  </video>
</div>
<script>
(function () {
  var overlay = document.getElementById('sc-intro-overlay');
  var vid = document.getElementById('sc-intro-video');
  if (!overlay || !vid) return;

  // 開場影片只在「真正從瀏覽器進入網站」時播一次：用 sessionStorage 記一個
  // 「這個分頁這次工作階段已經播過」的旗標，只要旗標存在，不管是點子頁連結
  // 回首頁、按瀏覽器上一頁（不管有沒有吃到 bfcache）、或重新整理，一律不重播。
  // 分頁關閉、或使用者直接開新分頁進站，sessionStorage 會是空的，才會再播一次。
  var SESSION_KEY = 'sc_introPlayed';
  try {
    if (sessionStorage.getItem(SESSION_KEY)) {
      overlay.remove();
      return;
    }
    sessionStorage.setItem(SESSION_KEY, '1');
  } catch (err) {
    // sessionStorage 被瀏覽器封鎖（例如嚴格隱私模式）時，退回用 referrer 判斷：
    // 同網域、且不是首頁自己，視為從站內子頁過來，一樣不播。
    try {
      if (document.referrer) {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin && ref.pathname !== location.pathname) {
          overlay.remove();
          return;
        }
      }
    } catch (err2) {}
  }

  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    overlay.style.opacity = '0';
    setTimeout(function () { overlay.remove(); }, 600);
  }

  vid.addEventListener('ended', reveal);
  // 影片無法播放（格式不支援、載入失敗等）就直接顯露頁面，不要卡住
  vid.addEventListener('error', reveal);
  // 保險：萬一瀏覽器封鎖自動播放、ended/error 都沒觸發，逾時也要顯露頁面
  setTimeout(reveal, 15000);
})();
</script>

      <!-- 手機/電腦版手動切換鈕（2026-08-02 新增）：放在「Contact」（桌機）／

  <!-- 全螢幕播放退出鈕（2026-08-02 新增）：只在 mobileFullscreenPlay 時出現，
       淡、細線繪製，跟頁首其他 icon（stroke-width:2、不透明）刻意做出區隔——
       這是播放期間唯一保留的互動元素，不用太搶眼，使用者知道「一定在螢幕
       某個角落」即可，Esc 鍵是更順手的退出方式，這顆按鈕只是備援。 -->

    <button onClick="{{ exitMobileFullscreenPlay }}" aria-label="退出全螢幕播放" style="position:fixed; top:16px; right:16px; z-index:1500; background:none; border:none; cursor:pointer; padding:10px; display:flex; align-items:center; justify-content:center; color:{{ textColor }}; opacity:0.45; transition:opacity 0.2s ease;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>

  </sc-if>

  <!-- NETWORK DIAGRAM -->
  <section id="works" style="padding:{{ worksPaddingTop }} 12px {{ worksPaddingBottom }}; position:relative; z-index:2; display:{{ worksDisplayMode }}; flex-grow:{{ worksFlexGrow }}; min-height:0;">
    <div data-globe-surface="1" style="width:100%; height:{{ globeSurfaceHeight }}; display:{{ globeSurfaceDisplay }}; align-items:center; justify-content:center; touch-action:{{ globeTouchAction }}; overflow:{{ globeOverflow }}; position:{{ globeSurfacePosition }}; inset:{{ globeSurfaceInset }}; z-index:{{ globeSurfaceZIndex }}; background-color:{{ globeSurfaceBg }};">
    <div style="width:{{ diagramContainerWidth }}; max-width:2000px; margin:0 auto; aspect-ratio:1/1; flex-shrink:0;">
    <svg data-globe-svg="1" viewBox="0 0 900 900" width="100%" height="100%" style="overflow: visible; fill: #930707; transition: transform 0.4s ease;">
        <sc-if value="{{ hasSpotlight }}" hint-placeholder-val="{{ false }}">
          <defs>
            <linearGradient id="spotlightGrad" gradientUnits="userSpaceOnUse" x1="{{ spotlight.x1 }}" y1="{{ spotlight.y1 }}" x2="{{ spotlight.x2 }}" y2="{{ spotlight.y2 }}">
              <stop offset="0%" stop-color="{{ spotlight.color }}" stop-opacity="0"></stop>
              <stop offset="55%" stop-color="{{ spotlight.color }}" stop-opacity="{{ spotlight.peakOpacity }}"></stop>
              <stop offset="100%" stop-color="{{ spotlight.color }}" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          <polygon points="{{ spotlight.points }}" fill="url(#spotlightGrad)" style="pointer-events:none;"></polygon>
        </sc-if>
        <sc-for list="{{ edges }}" as="edge" hint-placeholder-count="10">
          <line data-edge="{{ edge.id }}" x1="{{ edge.x1 }}" y1="{{ edge.y1 }}" x2="{{ edge.x2 }}" y2="{{ edge.y2 }}" stroke="{{ lineColor }}" stroke-width="{{ edgeStrokeWidth }}" style="opacity: {{ edge.opacity }}; transition: {{ edgeTransition }};"></line>
        </sc-for>

        <!-- 桌機 2D 圓環：單一層，跟改景深排序之前完全一樣，不受下面手機版
             雙層拆分影響（見 renderVals() isMobile 分支的說明）。 -->
        <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{ nodes }}" as="node" hint-placeholder-count="14">
            <a href="{{ node.href }}" style="cursor:{{ node.cursorStyle }}; pointer-events:{{ node.pointerEvents }};">
              <g data-node="{{ node.id }}" onMouseEnter="{{ node.onEnter }}" onMouseLeave="{{ node.onLeave }}" style="opacity: {{ node.opacity }}; transition: {{ nodeTransition }};">
                <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.hitR }}" fill="transparent"></circle>
                <circle data-dot="{{ node.id }}" cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.r }}" fill="{{ node.dotFill }}" style="transition:fill 0.3s;"></circle>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hoveredId: null, isDarkMode: false, showSearchModal: false, searchInput: '', searchResults: [], flashId: null, showMaterialMenu: false, viewportW: (typeof window !== 'undefined' ? window.innerWidth : 1200), showMobileSearch: false, showFooterContact: false, forcedMode: null, mobileFullscreenPlay: false };

  // 頁首新增的手機/電腦版手動切換鈕（2026-08-02）：`forcedMode` 是 null 時，
  // 完全比照原本的行為，單純依 viewportW 是否小於 768 判斷；使用者按過
  // 切換鈕之後變成 'mobile' 或 'desktop'，之後不管視窗多寬都固定用這個
  // 手動選擇的模式，直到再按一次切換鈕或重新整理頁面（forcedMode 是
  // instance state，不寫進 localStorage，重新整理會回到依畫面尺寸判斷）。
  // 這個檔案裡原本散落在好幾個地方（componentDidMount 的事件監聽器、
  // goToNode()、tick()、globeTick()、paintGlobe()、renderVals()）各自直接
  // 寫 `this.state.viewportW < 768`／`>= 768` 判斷手機/桌機——新增這個手動
  // 覆寫功能後，這些地方全部要改成呼叫這個方法，不能只改 renderVals()
  // 那一處，否則會出現「畫面看起來是手機版，但拖曳/搜尋/自轉等互動邏輯
  // 還是照桌機規則跑」這種樣板跟邏輯對不上的狀況。
  _effectiveIsMobile() {
    if (this.state.forcedMode != null) return this.state.forcedMode === 'mobile';
    return this.state.viewportW < 768;
  }

  toggleDeviceMode() {
    const next = this._effectiveIsMobile() ? 'desktop' : 'mobile';
    // 手動切換模式會讓 isMobile 的 sc-if 分支整個卸載/重新掛載（手機版的
    // data-node-back/data-node-front 節點群組、地標相關 DOM 都是全新的
    // 元素，不是同一批），_globeElCache（見 _ensureGlobeElCache()）快取的
    // 卻是切換前那批已經被移除的舊元素，且這個快取只會建立一次、之後永遠
    // 不會自動重建。不清掉的話，paintGlobe() 會繼續埋頭更新那些已經不在
    // 畫面上的舊元素，畫面上真正顯示的新元素則永遠停在剛掛載那一刻的位置
    // ——症狀是「切換幾次之後球體卡住不會轉」（2026-08-02 使用者回報並
    // 修正）。清掉快取讓 _ensureGlobeElCache() 下次呼叫時重新查詢，抓到
    // 這次掛載的新元素。
    this._globeElCache = null;
    this.setState({ forcedMode: next });
  }

  // Node names and hrefs from uploaded spreadsheet (活頁簿1-24674e73.xlsx):
  // Column B provides the node names, Column A provides the target URLs.
  // Category/section-header nodes get a fixed accent color and bold weight
  // regardless of light/dark mode. Each entry maps a node id to its color.
  specialIds = ['r1', 'r28', 'r59', 'r100', 'r2', 'r11', 'r22', 'r23', 'r101', 'r109', 'r115'];

  // Shared by both the desktop 2D ring and the mobile 3D globe (renderVals()
  // and buildGlobeGeometry()/paintGlobe() below) so a dot's "visual weight"
  // bump is defined in exactly one place.
  dotScale = 1.18;

  // 手機版 3D 球體：球半徑（viewBox 單位）、節點文字基準字級、目前的旋轉角度
  // （yaw 繞垂直軸、pitch 繞水平軸，單位皆為弧度）跟拖曳/慣性狀態。這幾個是
  // instance field（不是 state）——旋轉是由 paintGlobe()/globeTick() 每一影格
  // 直接寫 DOM 屬性驅動，刻意不透過 setState()，避免 60fps 都觸發一次完整的
  // reconcile（跟 tick()/startFlash() 現有的「動畫用原生 DOM、不用 setState」
  // 是同一個理由）。renderVals() 依然會讀這幾個 field 來算初次渲染的位置，
  // 所以就算中途因為別的原因（例如切換深色模式）觸發了一次正常的 re-render，
  // 畫出來的位置也是「目前轉到哪」，不會跳回初始角度。
  _GLOBE_SPHERE_RADIUS_VB = 260;
  _GLOBE_BASE_FONT_SIZE = 15;
  // 預設角度 0/0，旋轉完全交給使用者拖曳/閒置自轉決定。
  _globeYaw = 0;
  _globePitch = 0;
  _globeVelYaw = 0;
  _globeDragging = false;
  _globeDragDist = 0;
  _globeLastX = 0;
  _globeLastY = 0;
  // 雙指縮放：_globeZoom 是縮放倍率（1 = 預設大小），乘進
  // buildGlobeGeometry()/buildGlobeEdgeGeometry() 的螢幕座標、圓點半徑、字級
  // 計算裡（見這兩個方法）。_globeActivePointers 記錄目前放在螢幕上的每根
  // 手指（Map: pointerId -> {x,y}），兩根手指同時按著時才進入縮放模式。
  _globeZoom = 1;
  _GLOBE_ZOOM_MIN = 0.55;
  _GLOBE_ZOOM_MAX = 2.6;
  _globeActivePointers = new Map();
  _globePinching = false;
  _globePinchStartDist = 0;
  _globePinchStartZoom = 1;
  // ⚠️ 搜尋「飛到北極點」需要把旋轉拆成兩層，不能只靠 _globeYaw/_globePitch
  // 一組角度就做到——這是實作時繞了一次彎才發現的，記下來避免以後重踩：
  // 「_globeYaw 持續增加、y 軸上的點不會動」這個性質，只在該點的*原始*球面
  // 座標本身就滿足 x=z=0 時成立（也就是只有 Fibonacci sphere 排列時天生在
  // 兩極的 r1/r116）——對任何其他（絕大多數）節點，就算算出一組 (yaw0,
  // pitch0) 讓它「這一刻」剛好轉到北極點畫面座標，只要 yaw 繼續變動，它就會
  // 沿著一個小緯度圈慢慢飄走，不會真的釘住（實測：搜尋後等 1.5 秒，目標點
  // 還是飄了近 10px，不是完全不動）。
  //
  // 正確做法是兩層旋轉合成：_globeBaseYaw/_globeBasePitch 是「校準」層——
  // 搜尋時算一次、之後固定不變，把整顆球轉到「目標節點剛好在北極點」的
  // 姿勢；_globeYaw/_globePitch 維持原本的意義（自轉/拖曳），但現在是疊加在
  // 校準層*之上*的旋轉——疊加後再對北極點 (0,-1,0) 做 yaw 旋轉，這次才真的
  // 對，因為北極點在「校準後的座標系」裡本來就是 x=z=0。沒有搜尋過（或還
  // 沒點過搜尋結果）時 base 是 (0,0) 单位矩陣，行為跟以前完全一樣。
  // renderVals()/buildGlobeGeometry() 用 projectUnit() 這個方法做兩層合成，
  // 不要繞過它直接呼叫 rotateProject() 兩次自己兜。
  _globeBaseYaw = 0;
  _globeBasePitch = 0;

  // 搜尋後「飛到北極點」動畫：goToNode() 呼叫 startFlyTo() 時算出目前
  // base 到目標校準角度的補間終點，globeTick() 每影格用 easing 往目標推進
  // _globeBaseYaw/_globeBasePitch；同時把 _globePitch（自轉的上下傾斜）
  // 一併補間回 0，確保飛到定位那一刻，目標節點剛好落在畫面正上方置中，
  // 不會被使用者飛行前留下的傾斜角度帶偏。_globeYaw（左右自轉）不受影響、
  // 飛行中維持不變，飛完後繼續正常自轉——見上面 _globeYaw 為什麼不用重置。
  _globeFlying = false;
  _globeFlyStartBaseYaw = 0;
  _globeFlyStartBasePitch = 0;
  _globeFlyTargetBaseYaw = 0;
  _globeFlyTargetBasePitch = 0;

  _globeFlyStartSpinPitch = 0;
  _globeFlyStartTime = 0;
  _globeFlyDuration = 700;

  // 手機版全螢幕播放（2026-08-02 新增）：頁首整個隱藏（只留一個退出鈕）、
  // 頁尾隱藏、搜尋/漢堡選單/深淺模式/裝置切換全部不可用，球體本身撐滿整個
  // 螢幕，唯一允許的操作是拖曳旋轉球體（跟縮放——雙指縮放沒有被特別禁掉，
  // 使用者只提到「跳轉子網頁、搜尋等等」這些會離開/中斷播放的功能，縮放
  // 屬於單純觀看球體的一部分，跟旋轉是同一類）。進入時主動關閉任何已經
  // 開著的搜尋列/選單/標註，確保「無法使用任何功能」不會被進入當下還殘留
  // 開著的面板破例。
  // 順便觸發瀏覽器原生全螢幕（2026-08-02 新增，使用者要求「點擊全螢幕時
  // 順便同時觸發 Chrome 的全螢幕檢視功能」）：這是我們自己畫的 CSS 全螢幕
  // （球體撐滿 viewport）之外，額外再呼叫瀏覽器的 Fullscreen API 把網址列/
  // 系統導覽列這些瀏覽器本身的介面也收起來。兩者是獨立的兩件事——就算
  // Fullscreen API 呼叫失敗或整個不支援（例如 iOS Safari 對一般網頁元素
  // 不支援這組 API，只有 <video> 才有），CSS 那層「假全螢幕」的體驗完全
  // 不受影響，所以這裡刻意用 feature-detection＋靜默失敗，不讓進入播放
  // 模式依賴 Fullscreen API 能不能成功。
  _requestBrowserFullscreen() {
    const el = document.documentElement;
    const request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!request) return;
    const result = request.call(el);
    if (result && typeof result.catch === 'function') result.catch(() => {});
  }

  _exitBrowserFullscreen() {
    const isNativeFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    if (!isNativeFullscreen) return;
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (!exit) return;
    const result = exit.call(document);
    if (result && typeof result.catch === 'function') result.catch(() => {});
  }

  enterMobileFullscreenPlay() {
    if (this.state.flashId != null) this.dismissFlash();
    this.setState({
      mobileFullscreenPlay: true,
      showMobileSearch: false,
      searchInput: '',
      searchResults: [],
      showMaterialMenu: false
    });
    // 一定要在使用者手勢（按鈕的 click handler）同一個呼叫堆疊裡直接呼叫，
    // Fullscreen API 規定必須是「使用者手勢觸發」才准許，晚一點（例如包在
    // setState 的 callback 或 setTimeout 裡）呼叫會被瀏覽器拒絕。
    this._requestBrowserFullscreen();
  }

  exitMobileFullscreenPlay() {
    this.setState({ mobileFullscreenPlay: false });
    this._exitBrowserFullscreen();
  }

  componentDidMount() {
    this._onDocMouseDown = (e) => {
      const inBox = e.target && e.target.closest && e.target.closest('[data-search-box]');
      // Clicking anywhere except the search box closes the suggestion list.
      if (!inBox && this.state.searchResults.length) this.setState({ searchResults: [] });
      // ...and dismisses (fades out) an active flash highlight — any click
      // outside the search box, desktop or mobile alike (2026-07-31 再次調整：
      // 手機版曾經讓拖曳球體本身不算「點外面」以便邊看標註邊轉動球體，但
      // 使用者後來明確要求「做任何操作都要立刻消失」，取消了那個例外——
      // 拖曳球體本身額外靠 _onGlobePointerDown 開頭那行處理，見下面）。
      if (!inBox && this.state.flashId != null) this.dismissFlash();
      const inMenu = e.target && e.target.closest && e.target.closest('[data-menu-box]');
      if (!inMenu && this.state.showMaterialMenu) this.setState({ showMaterialMenu: false });
    };
    document.addEventListener('mousedown', this._onDocMouseDown);

    // 手機／平板適配：追蹤 viewport 寬度，驅動 renderVals() 裡的 isMobile 判斷。
    // debounce 一下，避免拖曳視窗縮放時瘋狂觸發 setState。
    this._resizeTimer = null;
    this._onResize = () => {
      if (this._resizeTimer) clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => {
        // 視窗寬度跨過 768px 斷點時，isMobile 的 sc-if 分支會整個卸載/
        // 重新掛載，跟 toggleDeviceMode() 手動切換的效果一樣，_globeElCache
        // 會指向已經被移除的舊元素（見 toggleDeviceMode() 的說明）——這其實
        // 是比手動切換鈕更早就存在的既有 bug（單純拖曳桌機瀏覽器視窗跨過
        // 斷點就會踩到），只是手動切換鈕讓它變得非常容易重現，這次一併修。
        // 有手動覆寫（forcedMode）時，視窗寬度變化不會影響實際顯示的模式，
        // 不需要清快取。
        const wasMobile = this._effectiveIsMobile();
        const newViewportW = window.innerWidth;
        const willBeMobile = this.state.forcedMode != null ? this.state.forcedMode === 'mobile' : newViewportW < 768;
        if (willBeMobile !== wasMobile) this._globeElCache = null;
        this.setState({ viewportW: newViewportW });
      }, 150);
    };
    window.addEventListener('resize', this._onResize);

    // 標註顯示後只要「滑動螢幕」也要立刻消失（見 _onGlobePointerDown 開頭
    // 那行、_onDocMouseDown 的說明）——球體拖曳本身已經在 pointerdown 處理，
    // 這裡另外補頁面捲動的情況（目前版面理論上不太會真的捲動，但保留這個
    // 監聽器以防萬一，成本很低）。
    this._onWinScroll = () => {
      if (this._effectiveIsMobile() && this.state.flashId != null) this.dismissFlash();
    };
    window.addEventListener('scroll', this._onWinScroll, { passive: true });

    // 全螢幕播放：Esc 鍵退出（使用者要求的兩種退出方式之一，另一種是畫面上
    // 的退出鈕，見樣板）。
    this._onFullscreenPlayKeydown = (e) => {
      if (e.key === 'Escape' && this.state.mobileFullscreenPlay) {
        this.exitMobileFullscreenPlay();
      }
    };
    document.addEventListener('keydown', this._onFullscreenPlayKeydown);

    // 使用者可能不透過我們的退出鈕/Esc 監聽器離開瀏覽器原生全螢幕——例如
    // Android 手勢／系統返回鍵、瀏覽器自己的全螢幕提示列——這些路徑不會
    // 呼叫 exitMobileFullscreenPlay()，只會讓瀏覽器觸發 fullscreenchange。
    // 監聽這個事件、發現已經不在原生全螢幕但 state 還是 true 時同步關掉，
    // 避免「已經離開全螢幕，但畫面還卡在播放模式（頁首依然隱藏）」的情況。
    // 這裡直接 setState，不呼叫 exitMobileFullscreenPlay()（那個方法自己會
    // 再呼叫一次 _exitBrowserFullscreen()，多此一舉——瀏覽器已經是這次
    // fullscreenchange 的源頭，不需要我們再叫它退出一次）。
    this._onFullscreenChange = () => {
      const isNativeFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      if (!isNativeFullscreen && this.state.mobileFullscreenPlay) {
        this.setState({ mobileFullscreenPlay: false });
      }
    };
    document.addEventListener('fullscreenchange', this._onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', this._onFullscreenChange);

    // 手機版 3D 球體：拖曳旋轉。掛在圓環的容器（data-globe-surface）上，用
    // Pointer Events 統一處理滑鼠／觸控。桌機（viewportW >= 768）完全不接
    // 這幾個事件的實際邏輯，只是掛著監聽器本身沒有副作用。
    //
    // ⚠️ 刻意不用 setPointerCapture()：一開始有用，但實測發現一旦在
    // pointerdown 當下 setPointerCapture 到 surface，接下來這個手勢產生的
    // pointerup／click 都會被瀏覽器整個「重新指向」到 surface 這個 <div>
    // 本身，不會再送到手指底下真正的節點（<circle>/<a>）——結果就是「輕點
    // 節點完全沒反應、連結永遠點不進去」，而且是靜止點擊也一樣壞掉，不是
    // 只有拖曳時才會這樣。改成拖曳開始後把 pointermove/pointerup 監聽器
    // 掛到 document 上（拖曳期間手指滑出 surface 範圍也還追蹤得到，效果
    // 跟 setPointerCapture 想要達到的一樣），放開後就把這兩個監聽器移除，
    // click 事件的目標元素就不會被動過手腳，點擊節點才能正常導覽到子頁。
    // 雙指縮放：_globeActivePointers 追蹤目前放在螢幕上的每根手指
    // （pointerId -> 目前座標）。一根手指＝拖曳旋轉（跟原本邏輯一樣）；兩根
    // 手指同時按著＝縮放模式，改用兩指之間的距離變化算縮放倍率，這段時間
    // 不會同時觸發旋轉，避免兩種手勢互相干擾、角度跟縮放同時亂跳。
    const surface = document.querySelector('[data-globe-surface]');
    this._onGlobePointerDown = (e) => {
      if (!this._effectiveIsMobile()) return;
      // 手指一碰到球體（不管是要拖曳轉動、雙指縮放，還是點被標註的圓點本身）
      // 就立刻讓標註消失——比等 document 上的 mousedown 更早觸發，感覺才夠
      // 「馬上」（2026-07-31 調整：使用者要求「標註顯示後做任何操作都要立刻
      // 消失」，取消了先前「拖曳球體本身不算操作」的例外）。
      if (this.state.flashId != null) this.dismissFlash();
      this._globeActivePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this._globeActivePointers.size === 1) {
        // 使用者主動抓住球體，取消還在跑的「飛到北極點」動畫，改由手勢接管。
        this._globeFlying = false;
        this._globeDragging = true;
        this._globeVelYaw = 0;
        this._globeDragDist = 0;
        this._globeLastX = e.clientX;
        this._globeLastY = e.clientY;
        document.addEventListener('pointermove', this._onGlobePointerMove);
        document.addEventListener('pointerup', this._onGlobePointerUp);
        document.addEventListener('pointercancel', this._onGlobePointerUp);
      } else if (this._globeActivePointers.size === 2) {
        this._globeFlying = false;
        this._globePinching = true;
        this._globeDragging = false;
        const pts = Array.from(this._globeActivePointers.values());
        this._globePinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        this._globePinchStartZoom = this._globeZoom;
        // 兩指手勢結束後放開的 click 一律不當成點擊節點。
        this._globeDragDist += 999;
      }
    };
    this._onGlobePointerMove = (e) => {
      if (!this._globeActivePointers.has(e.pointerId)) return;
      this._globeActivePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (this._globePinching && this._globeActivePointers.size >= 2) {
        const pts = Array.from(this._globeActivePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const ratio = dist / this._globePinchStartDist;
        this._globeZoom = Math.max(this._GLOBE_ZOOM_MIN, Math.min(this._GLOBE_ZOOM_MAX, this._globePinchStartZoom * ratio));
        this.paintGlobe();
        return;
      }

      if (!this._globeDragging) return;
      const dx = e.clientX - this._globeLastX;
      const dy = e.clientY - this._globeLastY;
      this._globeLastX = e.clientX;
      this._globeLastY = e.clientY;
      this._globeDragDist += Math.abs(dx) + Math.abs(dy);
      const sens = 0.012;
      this._globeYaw += dx * sens;
      this._globeVelYaw = dx * sens;
      // pitch 不夾限範圍（原本限制在 ±1.15 弧度內，避免手動拖曳把球體整個
      // 「翻過去」）。搜尋飛到北極點（startFlyTo()）常常需要把 pitch 轉到
      // 這個範圍以外才能把目標節點轉到畫面正上方——如果拖曳還夾在 ±1.15，
      // 飛到定位後只要使用者一伸手拖曳，pitch 會瞬間被夾回範圍內，畫面會
      // 明顯跳一下。乾脆讓拖曳跟飛行共用同一個「pitch 沒有邊界」的規則。
      // （2026-07-31：曾經在標註成立時鎖住這裡不套用 dy，只給水平拖曳——
      // 後來使用者要求標註顯示後只要一拖曳就要立刻整個消失，鎖定的當下
      // 標註已經不在了，這段限制變成永遠不會生效的死狀態，一併拿掉。）
      this._globePitch -= dy * sens;
      this.paintGlobe();
    };
    this._onGlobePointerUp = (e) => {
      this._globeActivePointers.delete(e.pointerId);
      if (this._globeActivePointers.size < 2) this._globePinching = false;
      if (this._globeActivePointers.size === 1) {
        // 從兩指縮放收回成一根手指——把單指拖曳的基準點重設到剩下那根手指
        // 目前的位置，避免手指數量切換的瞬間角度跳一下。
        const remaining = Array.from(this._globeActivePointers.values())[0];
        this._globeLastX = remaining.x;
        this._globeLastY = remaining.y;
        this._globeDragging = true;
      } else if (this._globeActivePointers.size === 0) {
        this._globeDragging = false;
        document.removeEventListener('pointermove', this._onGlobePointerMove);
        document.removeEventListener('pointerup', this._onGlobePointerUp);
        document.removeEventListener('pointercancel', this._onGlobePointerUp);
      }
    };
    // 拖曳距離超過一點點門檻，放開時視為「在轉球體/縮放」而不是「點節點」，
    // 攔截緊接在後面的 click，避免拖曳結束時誤觸連結跳轉到子頁。
    this._onGlobeClickCapture = (e) => {
      if (this._globeDragDist > 6) {
        e.preventDefault();
        e.stopPropagation();
      }
    };
    if (surface) {
      surface.addEventListener('pointerdown', this._onGlobePointerDown);
      surface.addEventListener('click', this._onGlobeClickCapture, true);
    }
    this._globeRaf = requestAnimationFrame(() => this.globeTick());
  }

  componentWillUnmount() {
    if (this._onDocMouseDown) document.removeEventListener('mousedown', this._onDocMouseDown);
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._onWinScroll) window.removeEventListener('scroll', this._onWinScroll);
    if (this._onFullscreenPlayKeydown) document.removeEventListener('keydown', this._onFullscreenPlayKeydown);
    if (this._onFullscreenChange) {
      document.removeEventListener('fullscreenchange', this._onFullscreenChange);
      document.removeEventListener('webkitfullscreenchange', this._onFullscreenChange);
    }
    const surface = document.querySelector('[data-globe-surface]');
    if (surface) {
      surface.removeEventListener('pointerdown', this._onGlobePointerDown);
      surface.removeEventListener('click', this._onGlobeClickCapture, true);
    }
    document.removeEventListener('pointermove', this._onGlobePointerMove);
    document.removeEventListener('pointerup', this._onGlobePointerUp);
    document.removeEventListener('pointercancel', this._onGlobePointerUp);
    if (this._globeRaf) cancelAnimationFrame(this._globeRaf);
    if (this._resizeTimer) clearTimeout(this._resizeTimer);
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._fadeTimer) clearTimeout(this._fadeTimer);
    if (this._flash) this._flash.remove();
    if (this._tri) this._tri.remove();
    if (this._pinLineSvg) this._pinLineSvg.remove();
    if (this._pinLink) this._pinLink.remove();
  }

  goToNode(id) {
    if (this._fadeTimer) { clearTimeout(this._fadeTimer); this._fadeTimer = null; }
    this._dismissing = false;
    // 手機版搜尋列選定結果後自動收合（2026-07-31 調整）：使用者回報「地標
    // icon 被搜尋欄擋住」——搜尋欄（`[data-search-box="1"]`，手機展開時是
    // position:fixed 貼齊頁面頂端的一整條）選了結果之後原本會一直留著，跟
    // 釘在北極點（畫面最上方）的地標 icon 疊在同一塊區域，就算地標的
    // z-index 比較高、視覺上蓋得過去，兩個元素黏在一起看起來還是很擠、像
    // 被擋住。選到結果代表這次搜尋已經結束，直接把搜尋列收回去，畫面最上方
    // 讓給地標，兩者不再有機會疊在一起。桌機版的搜尋框不是靠這個 state 控制
    // 顯示/隱藏的（見 renderVals() 的 searchBoxDisplay），這裡收合對桌機沒
    // 有任何影響。
    const closingMobileSearch = this._effectiveIsMobile() ? { showMobileSearch: false, searchInput: '' } : {};
    this.setState({ flashId: id, hoveredId: id, searchResults: [], ...closingMobileSearch });
    this.ensureFlash();
    this.ensureTriangle();
    this.startFlash(id);
    // 手機版 3D 球體：把搜到的節點飛轉到北極點固定住，其餘節點照常繞著這個
    // 軸自轉（見 startFlyTo()/computeSpherePoseFor() 的說明）。桌機是平面
    // 2D 圓環，沒有這個旋轉系統，不受影響。
    if (this._effectiveIsMobile()) {
      this.startFlyTo(id);
      // 手機版地標 icon＋虛線（見 ensureLandmark()）：只在手機版顯示，桌機
      // 的節點本來就都能直接點，不需要這個額外的導覽入口。
      const node = this.nodeData.find(d => d.id === id);
      this.ensureLandmark();
      if (node && this._pinLink) {
        this._pinLink.href = node.href;
        if (this._pinLinkLabel) this._pinLinkLabel.textContent = node.name;
        // dismissFlash() 的淡出計時器結束時會把 display 設成 'none'（見該
        // 方法），但沒有任何地方會把它設回來——ensureLandmark() 本身只在
        // 元素第一次建立時才會設 display:flex，第二次之後因為元素已經存在
        // 直接 return，不會重新設定。結果是「第一次搜尋正常出現，dismiss
        // 之後 display 卡在 none，第二次搜尋 icon 再也不會出現」（使用者
        // 回報「2 次搜尋後 icon 跑不出來」，2026-08-02 修正）。每次重新
        // 定位都要主動把 display 撥回來，跟 startFlash() 每次都重設
        // `f.style.display = 'block'` 是同一個道理。
        this._pinLink.style.display = 'flex';
      }
      // 重新記錄成長動畫的起始時間，讓虛線每次搜尋定位都重新「長出來」一次，
      // 就算上一次的虛線還沒完全淡出也一樣重新播放。
      this._pinGrowStart = performance.now();
    }
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = requestAnimationFrame(() => this.tick());
  }

  ensureFlash() {
    // Solid yellow circle. Body-appended (outside the DC template) so the
    // runtime's per-frame re-render can't reset its inline styles. z-index:1
    // sits ABOVE the opaque page background but BELOW the diagram (the #works
    // section is given z-index:2), so it never covers any graph element.
    if (this._flash && document.body.contains(this._flash)) return this._flash;
    const f = document.createElement('div');
    f.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:1; display:none; opacity:0; transition:opacity 0.45s ease; filter:blur(4px);';
    document.body.appendChild(f);
    this._flash = f;
    return f;
  }

  ensureTriangle() {
    // Flat isosceles triangle that points at an off-screen target. Sits above
    // the graph (but below the header) so it's always visible at the edge.
    if (this._tri && document.body.contains(this._tri)) return this._tri;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:950; opacity:0; pointer-events:none; transition:opacity 0.45s ease;';
    const rot = document.createElement('div');
    rot.style.transform = 'rotate(0deg)';
    const pulse = document.createElement('div');
    pulse.style.cssText = 'animation: arrowPulse 0.9s ease-in-out infinite;';
    const tri = document.createElement('div');
    // Wide, short isosceles triangle pointing right.
    tri.style.cssText = 'width:52px; height:26px; background:#FFD400; clip-path:polygon(0% 0%, 0% 100%, 100% 50%); filter:drop-shadow(0 2px 5px rgba(0,0,0,0.35));';
    pulse.appendChild(tri);
    rot.appendChild(pulse);
    wrap.appendChild(rot);
    document.body.appendChild(wrap);
    this._tri = wrap;
    this._triRot = rot;
    return wrap;
  }

  // 找出目前「實際顯示中」的那顆 dot，給 startFlash()/tick() 量測位置用。
  // 桌機版每個節點只有一份 DOM（data-dot="id"），直接查就好；手機版
  // 2026-07-31 加了景深排序之後，每個節點在 DOM 裡其實有「背面層」「正面層」
  // 兩份（見樣板、_ensureGlobeElCache() 的說明），只有一份的 display 不是
  // none——如果還是用 `document.querySelector('[data-dot="id"]')` 直接查，
  // 拿到的永遠是 DOM 順序在前的那份（背面層），節點轉到正面時量到的會是
  // 背面層那份已經 display:none、getBoundingClientRect() 全部是 0 的錯誤
  // 座標，黃色亮點／地標 icon 會整個定位到螢幕左上角。
  _visibleDot(id) {
    const back = document.querySelector('[data-node-back="' + id + '"]');
    const front = document.querySelector('[data-node-front="' + id + '"]');
    if (!back && !front) return document.querySelector('[data-dot="' + id + '"]'); // 桌機：只有一份
    const active = (back && getComputedStyle(back).display !== 'none') ? back : front;
    return active ? active.querySelector('[data-dot]') : null;
  }

  // 手機版搜尋定位後，標註點正上方的虛線＋地標 icon：讓使用者除了點小小的
  // 圓點本身，還有一個大很多、明顯是「可以點」的目標可以進入子頁。虛線用
  // 一個蓋滿整個畫面的 <svg>（跟 flash/triangle 一樣是原生 DOM、不透過樣板，
  // 理由相同——見上面 field 宣告處的說明）裝一條 <line>，pathLength="1" 讓
  // stroke-dasharray/dashoffset 可以用 0~1 的比例表示「畫了多少」，不用管
  // 線實際多長；地標 icon 是一個真正的 <a href>，讓既有的頁面轉場腳本
  // （document 上監聽 a[href$=".dc.html"] 的那段）可以直接處理點擊導覽，
  // 不用另外重寫一套轉場邏輯。
  ensureLandmark() {
    if (this._pinLineSvg && document.body.contains(this._pinLineSvg)) return;
    // z-index 刻意設得比頁首（1000）／手機搜尋列（1001）都高（2026-07-31
    // 調整）——頁首本身其實沒有背景色（`<header>` 只有 padding/flex，實際
    // 有背景色的只有裡面 logo／導覽 pill 那兩塊半透明毛玻璃小方塊，中段是
    // 透明的），地標會被「切掉一角」單純是因為 z-index 比頁首低、疊圖順序
    // 輸了，不是真的被裁切。把地標疊到最上層之後，虛線/圖示長多高都不會
    // 再被頁首（或其他固定定位的 UI）擋到，不需要再夾限「安全高度」。
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('style', 'position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1010; opacity:0; transition:opacity 0.3s ease;');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('pathLength', '1');
    // 顏色（黑／金）在 tick() 裡依 isDarkMode 動態設定，這裡先給個預設值；
    // dasharray 也是每影格在 tick() 裡動態算（漸進式斷點，見該處），這裡
    // 只是給個初始值避免第一影格畫出來前是空的。
    line.setAttribute('stroke', '#000000');
    line.setAttribute('stroke-width', '0.75');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-dasharray', '0.02 0.03');
    line.style.animation = 'dashFlow 0.6s linear infinite';
    line.style.filter = 'drop-shadow(0 1px 2px rgba(0,0,0,0.35))';
    svg.appendChild(line);
    document.body.appendChild(svg);
    this._pinLineSvg = svg;
    this._pinLineEl = line;

    const a = document.createElement('a');
    a.style.cssText = 'position:fixed; left:50%; top:50%; transform:translate(-50%,-100%); z-index:1010; display:flex; opacity:0; pointer-events:none; transition:opacity 0.3s ease; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.4));';
    // 純線條、不填色的地標 icon（跟頁首搜尋/漢堡選單那些線條 icon 同一種
    // 風格）——顏色用 currentColor，跟著 tick() 裡設在 <a> 上的 color 走。
    // 尺寸縮小成原本的一半（30x38 -> 15x19）、描邊也減半（2 -> 1），兩者
    // 疊加後視覺線條會更細（2026-07-31 調整）。
    // 點擊回饋（2026-08-02 新增）：icon 本身按壓縮放 + 一圈黃色漣漪往外
    // 擴散淡出，示意「點下去會進入該子頁」——跟圓點點擊沿用同一個黃色
    // （specialColor 深色模式那組金色），視覺語言一致。漣漪 span 用
    // position:absolute 疊在 icon 正中央，`a` 本身是 position:fixed，剛好
    // 是最近的定位祖先，不需要另外包一層 wrapper。
    a.innerHTML = '<span class="pin-ripple" style="position:absolute; left:50%; top:50%; width:26px; height:26px; border-radius:50%; background:radial-gradient(circle, rgba(255,208,0,0.9) 0%, rgba(255,208,0,0.5) 55%, rgba(255,208,0,0) 100%); opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(0.25);"></span><svg width="15" height="19" viewBox="0 0 24 32" fill="none" stroke="currentColor" style="position:relative; transform-origin:50% 50%;"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" stroke-width="1"></path><circle cx="12" cy="12" r="4.3" stroke-width="1"></circle></svg>';
    const label = document.createElement('div');
    label.style.cssText = 'position:absolute; width:1px; height:1px; overflow:hidden; opacity:0;';
    a.appendChild(label);
    document.body.appendChild(a);
    this._pinLink = a;
    this._pinRipple = a.querySelector('.pin-ripple');
    this._pinIconSvg = a.querySelector('svg');
    // 2026-08-02 修正：使用者回報「漣漪不是點擊觸發，而是地標一出現就
    // 不斷播放」——本機用滑鼠點擊、真實觸控事件模擬、事件計數器都測不出
    // click 監聽器被多次觸發，懷疑是真實手機瀏覽器對「同一個 click 事件
    // 補觸發一次 ghost click」之類的相容性行為（或其他測不出來的重複觸發
    // 路徑），在本機環境重現不出來。既然抓不到確切成因，這裡直接把觸發
    // 邏輯改成對「重複觸發」免疫，不管背後真正原因是什麼都不會再看到
    // 視覺上「不斷播放」的效果：(1) 500ms 內的重複觸發直接忽略（動畫本身
    // 只有 0.5s，同一次點擊不可能真的需要在這之內重播第二次）；(2) 動畫
    // 結束時用 animationend 明確把 ripple 收回乾淨的隱藏狀態，不完全依賴
    // fill-mode:forwards（部分行動裝置瀏覽器對「用 none→reflow→重新指定
    // 動畫名稱」這種重播技巧的 fill-mode 支援不夠一致）。
    this._pinRippleLastTrigger = 0;
    const playPinClickAnim = () => {
      const now = performance.now();
      if (now - this._pinRippleLastTrigger < 500) return;
      this._pinRippleLastTrigger = now;
      const ripple = this._pinRipple, icon = this._pinIconSvg;
      if (ripple) {
        ripple.style.animation = 'none';
        void ripple.offsetWidth;
        ripple.style.animation = 'pinClickRipple 0.5s ease-out 1 forwards';
      }
      if (icon) {
        icon.style.animation = 'none';
        void icon.offsetWidth;
        icon.style.animation = 'pinClickPress 0.35s ease 1';
      }
    };
    a.addEventListener('click', playPinClickAnim);
    if (this._pinRipple) {
      this._pinRipple.addEventListener('animationend', () => {
        this._pinRipple.style.animation = 'none';
        this._pinRipple.style.opacity = '0';
        this._pinRipple.style.transform = 'translate(-50%,-50%) scale(0.25)';
      });
    }
    this._pinLinkLabel = label;
  }

  startFlash(id) {
    const f = this._flash;
    const dot = this._visibleDot(id);
    if (!f || !dot) return;
    const dr = dot.getBoundingClientRect();
    const clickedR = Math.max(dr.width, dr.height) / 2;
    let maxR = clickedR;
    document.querySelectorAll('[data-dot]').forEach(d => {
      const w = d.getBoundingClientRect().width / 2;
      if (w > maxR) maxR = w;
    });
    // Solid disc a bit larger than the biggest dot; soft edge via a radial
    // gradient that stays solid then fades right at the rim.
    const flashR = Math.max(clickedR * 2.2, maxR + 16);
    f.style.width = f.style.height = (flashR * 2) + 'px';
    f.style.webkitMaskImage = 'none';
    f.style.maskImage = 'none';
    f.style.background = 'radial-gradient(circle, rgba(255,208,0,0.95) 22%, rgba(255,208,0,0.6) 48%, rgba(255,208,0,0.25) 70%, rgba(255,208,0,0) 100%)';
    f.style.display = 'block';
  }

  dismissFlash() {
    this._dismissing = true;
    const f = this._flash, t = this._tri, pl = this._pinLineSvg, pin = this._pinLink;
    if (f) f.style.opacity = '0';
    if (t) t.style.opacity = '0';
    if (pl) pl.style.opacity = '0';
    if (pin) pin.style.opacity = '0';
    if (this._globeSvgEl) this._globeSvgEl.style.transform = '';
    if (this._fadeTimer) clearTimeout(this._fadeTimer);
    this._fadeTimer = setTimeout(() => {
      if (this._raf) cancelAnimationFrame(this._raf);
      this._raf = null;
      if (f) f.style.display = 'none';
      if (pin) pin.style.display = 'none';
      this.setState({ flashId: null, hoveredId: null });
    }, 480);
  }

  tick() {
    const id = this.state.flashId;
    if (id == null) return;
    const dot = this._visibleDot(id);
    if (dot) {
      const dr = dot.getBoundingClientRect();
      const cxp = dr.left + dr.width / 2;
      const cyp = dr.top + dr.height / 2;
      // 52px 邊界對窄螢幕來說占比太大，手機版縮小邊界到 16px，避免節點被誤判
      // 「太靠邊」而顯示三角形指示、不顯示黃色亮點。目前手機版容器本來就縮得
      // 比 viewport 小很多（見 renderVals() 的 diagramContainerWidth），所有
      // 116 個節點都落在安全範圍內，但仍保留這個較小邊界作為未來調整的緩衝。
      const isMobileTick = this._effectiveIsMobile();
      const vw = window.innerWidth, vh = window.innerHeight, margin = isMobileTick ? 16 : 52;
      const inView = cxp >= margin && cxp <= vw - margin && cyp >= margin && cyp <= vh - margin;
      // Circle rides the dot.
      if (this._flash) {
        this._flash.style.left = cxp + 'px';
        this._flash.style.top = cyp + 'px';
      }
      // Triangle clamps to the screen edge, rotated toward the dot.
      if (this._tri) {
        const angle = Math.atan2(cyp - vh / 2, cxp - vw / 2);
        this._tri.style.left = Math.max(margin, Math.min(vw - margin, cxp)) + 'px';
        this._tri.style.top = Math.max(margin, Math.min(vh - margin, cyp)) + 'px';
        this._triRot.style.transform = 'rotate(' + (angle * 180 / Math.PI) + 'deg)';
      }
      // Cross-fade triangle <-> circle as the dot enters/leaves the viewport.
      if (!this._dismissing) {
        if (this._flash) this._flash.style.opacity = inView ? '1' : '0';
        if (this._tri) this._tri.style.opacity = inView ? '0' : '1';
      }

      // 手機版地標 icon＋虛線：只在手機版、標註點在畫面內時顯示，跟著 dot
      // 的即時螢幕座標更新（globe 每影格都在動，這裡本來就已經是每影格重新
      // 量測 dot 位置的迴圈，順便一起更新最省事）。桌機沒有這組元素可更新
      // （ensureLandmark() 只在 goToNode() 手機分支才會呼叫），這幾個 if
      // 自然是 no-op。
      if (this._pinLineSvg && this._pinLink) {
        const showPin = isMobileTick && inView && !this._dismissing;
        if (showPin) {
          const dotR = Math.max(dr.width, dr.height) / 2;
          // CSS px／cm 換算（96dpi ÷ 2.54，瀏覽器標準值），下面「幾 cm」的
          // 需求都靠這個常數換算成 px。
          const CM_PX = 37.8;
          // 地標 icon 位置：先往上拉 2cm，再多拉高 0.5cm（2026-07-31 調整），
          // 之後往下移回 0.2cm、這次再往下移 1cm（2026-08-02 兩次調整），
          // 累計下來線長比最初的 2.5cm 短了 1.2cm，icon 跟著往下靠近圓點。
          const lineLen = dotR + 60 + CM_PX * 1.3;
          // 虛線向上延伸的「長出來」動畫：搜尋定位後 380ms 內從 0 長到全長，
          // 之後維持全長，靠 CSS 的 dashFlow 關鍵影格做持續流動的虛線效果。
          const growMs = 380;
          const g = this._pinGrowStart ? Math.min(1, (performance.now() - this._pinGrowStart) / growMs) : 1;
          const eased = 1 - Math.pow(1 - g, 3);
          const startY = cyp - dotR;
          // 地標的 z-index 雖然拉到比頁首／搜尋列都高（見 ensureLandmark()），
          // 疊圖順序上不會被頁首「擋住」，但使用者這次明確要求 icon 的高度
          // 要低於頁首下緣——不是疊圖順序的問題，是位置本身就不該跑到頁首
          // 那一段去（2026-07-31 再次調整，重新加回夾頁首下緣的邏輯，取代
          // 上一版只夾「螢幕最上緣」的做法）。夾住的是虛線終點／icon 錨點，
          // icon 本身靠 transform:translate(-50%,-100%) 還會從錨點再往上長
          // 19px（icon 目前的實際高度，見 ensureLandmark()），下限要把這段
          // 也算進去，才是「icon 頂端」真正貼齊頁首下緣（留 8px 緩衝）的
          // 位置；同時保留「螢幕最上緣」那個下限當防呆（正常情況下頁首下緣
          // 這條線一定比較嚴格，螢幕上緣那條理論上用不到，但留著避免萬一
          // 頁首量不到時 icon 還是有機會跑出螢幕外）。
          const pinIconHeight = 19;
          const headerEl = document.querySelector('header');
          const headerBottomY = headerEl ? headerEl.getBoundingClientRect().bottom : 96;
          const minY = Math.max(8 + pinIconHeight, headerBottomY + pinIconHeight + 8);
          const endY = Math.max(startY - lineLen * eased, minY);
          // 標註出現時整顆球體（節點＋標題＋連線，全部包在同一個
          // <svg data-globe-svg> 裡）一起往下平移，讓 icon 最上緣離頁首下緣
          // 至少留 2cm（2026-08-02 新增，使用者要求「不是只求不被擋住，
          // 是完整地出現在畫面中」）。不用繼續夾 endY 本身——那樣只會讓線
          // 變短、貼死在頁首下面，跟「線從圓點長出來」的視覺矛盾；改成移動
          // 整顆球，圓點、線長、icon 的相對關係完全不變，只是整組一起往下
          // 挪出這段空間。
          //
          // 這裡不能直接拿「這一影格量到的 iconTopY」去跟需求值比較就把
          // 差值疊加上去（ratchet），因為 svg 上的 transform 有 0.4s
          // CSS transition，量到的 dot 位置其實是「還在補間中」的即時值，
          // 疊加會跟轉場動畫互相打架、越疊越多。做法是先用
          // getComputedStyle 讀出「這一影格當下真正生效的位移量」
          // （DOMMatrix 的 .f 就是 translateY 的即時值，不是我們設定的
          // 目標值，兩者在轉場過程中不相等），從量到的 iconTopY 扣掉這個
          // 即時位移，還原出「沒有位移時」icon 應該在哪裡，再用這個還原值
          // 跟需求值比較，每影格都算出正確的絕對目標，不會因為轉場還沒
          // 補完就重複疊加。
          const svgEl = this._globeSvgEl || (this._globeSvgEl = document.querySelector('[data-globe-svg]'));
          if (svgEl) {
            let liveShiftY = 0;
            const svgTransform = getComputedStyle(svgEl).transform;
            if (svgTransform && svgTransform !== 'none') {
              liveShiftY = new DOMMatrix(svgTransform).f;
            }
            const requiredIconTopY = headerBottomY + pinIconHeight + CM_PX * 2;
            const iconTopY = endY - pinIconHeight;
            const unshiftedIconTopY = iconTopY - liveShiftY;
            const neededShift = Math.max(0, requiredIconTopY - unshiftedIconTopY);
            if (Math.abs(neededShift - liveShiftY) > 0.5) {
              svgEl.style.transform = neededShift > 0 ? 'translateY(' + neededShift.toFixed(1) + 'px)' : '';
            }
          }
          // 淺色模式黑線、深色模式金線（跟 specialColor 深色模式用的金色是
          // 同一個色號）——不是黃色亮點那種填色強調，純粹線條，所以每影格
          // 直接依目前 isDarkMode 設定顏色，深色模式切換當下也會立刻跟著換。
          const pinColor = this.state.isDarkMode ? '#BDA434' : '#000000';
          this._pinLineEl.setAttribute('x1', cxp);
          this._pinLineEl.setAttribute('y1', startY);
          this._pinLineEl.setAttribute('x2', cxp);
          this._pinLineEl.setAttribute('y2', endY);
          this._pinLineEl.setAttribute('stroke', pinColor);
          // 虛線斷點分三段（2026-07-31 再次調整，「飛碟降落」的視覺）：
          // pathLength t=0（x1/y1，圓點端）到 t=1（x2/y2，icon 端）。
          //   1. 最下方 1cm（貼著圓點/地面那一段）：固定用整條線裡最短的
          //      虛線單位，重複排列，不漸變——像降落點的一排小光點。
          //   2. 中段（1cm 之後，到 icon 下方 1cm 之前）：漸進式，虛線從
          //      跟第 1 段一樣短的單位開始，逐段變長——像光束從地面往上
          //      漸漸凝聚變粗。
          //   3. 最上方 1cm（icon 正下方）：直接變實線銜接到 icon 底部——
          //      像光束在飛船（icon）這端已經完全成形。
          // 全部依目前這條線實際的像素長度（startY 到 endY 的距離）重新
          // 分配成 0~1 的 pathLength 比例，不管線多長/多短都是同一種效果。
          // CSS 的 dashFlow 關鍵影格繼續只動 stroke-dashoffset，跟這裡每
          // 影格重算的 dasharray（形狀）是兩個獨立屬性，「虛線流動」的
          // 動畫效果不受影響，只是流動的「形狀」變了。
          const lineLenPx = Math.max(1, startY - endY);
          const bottomFrac = Math.min(0.3, CM_PX / lineLenPx);
          const topSolidFrac = Math.min(0.3, CM_PX / lineLenPx);
          const middleFrac = Math.max(0.05, 1 - bottomFrac - topSolidFrac);
          const K = 6;
          const dashWeights = [1, 1.6, 2.4, 3.4, 4.6, 6];
          const gapWeight = 2;
          const totalWeight = dashWeights.reduce((s, w) => s + w, 0) + K * gapWeight;
          const scale = middleFrac / totalWeight;
          const unitDash = dashWeights[0] * scale;
          const unitGap = gapWeight * scale;
          const parts = [];
          if (unitDash + unitGap > 0.0005) {
            let filled = 0, guard = 0;
            while (filled < bottomFrac && guard < 60) {
              parts.push(unitDash.toFixed(4), unitGap.toFixed(4));
              filled += unitDash + unitGap;
              guard++;
            }
          }
          dashWeights.forEach(w => { parts.push((w * scale).toFixed(4)); parts.push((gapWeight * scale).toFixed(4)); });
          parts.push(topSolidFrac.toFixed(4));
          this._pinLineEl.setAttribute('stroke-dasharray', parts.join(' '));
          this._pinLineSvg.style.opacity = String(eased);
          this._pinLink.style.left = cxp + 'px';
          this._pinLink.style.top = endY + 'px';
          this._pinLink.style.opacity = String(eased);
          this._pinLink.style.color = pinColor;
          this._pinLink.style.pointerEvents = eased > 0.6 ? 'auto' : 'none';
        } else {
          this._pinLineSvg.style.opacity = '0';
          this._pinLink.style.opacity = '0';
          this._pinLink.style.pointerEvents = 'none';
          if (this._globeSvgEl) this._globeSvgEl.style.transform = '';
        }
      }
    }
    this._raf = requestAnimationFrame(() => this.tick());
  }

  // 每個節點的連線數，決定圓點大小（degree 越高，圓點越大）。
  computeDegree() {
    const degree = {};
    this.nodeData.forEach(d => { degree[d.id] = 0; });
    this.edgeData.forEach(([a, b]) => {
      if (a in degree) degree[a]++;
      if (b in degree) degree[b]++;
    });
    return degree;
  }

  // 依連線數算出的圓點半徑（viewBox 單位，未乘 dotScale），桌機 2D 圓環、
  // 手機 3D 球體都用同一份數字，而且 paintGlobe() 這種在 renderVals() 之外
  // 單獨跑的方法也需要用到，所以算過一次就記住，不用每次重算。
  computeNodeRadiusMap() {
    if (this._nodeRadiusMap) return this._nodeRadiusMap;
    const degree = this.computeDegree();
    const maxDegree = Math.max(1, ...Object.values(degree));
    const rMin = 4, rMax = 24;
    const map = {};
    this.nodeData.forEach(d => {
      map[d.id] = rMin + (degree[d.id] / maxDegree) * (rMax - rMin);
    });
    this._nodeRadiusMap = map;
    return map;
  }

  // 手機版 3D 球體：把 116 個節點分布在單位球面上（Fibonacci sphere 演算法
  // ——黃金角讓「連續索引」在球面上均勻散開，緯度靠索引線性決定高度，經度靠
  // 黃金角螺旋決定角度）。旋轉只會轉動這些點的「觀察角度」，點跟點之間的
  // 相對位置（也就是資料結構本身）不會變。這份配置不依賴旋轉角度，算一次
  // 記住即可。
  //
  // specialIds（章/成/法/構等 11 個分類大標節點）跟其餘 105 個一般節點，
  // 分成兩組各自獨立跑一次 Fibonacci sphere 公式，不是全部 116 個共用同一
  // 組連續索引（2026-07-31 修正——使用者回報「大標題」在球面上擠成一團）。
  //
  // ⚠️ 一開始的修法是錯的，記錄一下避免以後重踩：曾經試過「全部共用同一組
  // 116 個索引，但保留 11 個平均間隔（每 116/11≈10.5 個位置一個）的槽位給
  // specialIds」——緯度（y）確實變均勻了（線性函數，索引平均分佈，y 自然
  // 平均分佈），但經度（theta = 黃金角 × 索引）完全沒有均勻分佈：黃金角
  // 「相鄰索引分散」的性質只在**間隔為 1** 的連續索引上成立，間隔約 10.5
  // 的索引之間，theta 每次只增加「黃金角×10.5 mod 360°」這一個固定的小
  // 角度（實測約 3.8°），11 個點的 theta 全部擠在 0°~103° 這一小段裡，
  // 反而比原本更集中在經度方向。用 Playwright 直接讀 `computeSphereUnits()`
  // 的原始座標驗證過這個問題，不是肉眼猜的。
  //
  // 正確做法：specialList、regularList 各自從 i=0 開始，各自代入自己那組
  // 的 n（11、105）算 Fibonacci sphere——黃金角「連續索引均勻散開全球面」
  // 的性質對任何 n 都成立，兩組各自單獨看都會均勻覆蓋整個球面（緯度、經度
  // 都均勻），疊在同一顆球上自然不會擠成一團。desktop 的 2D 圓環排版完全
  // 不受影響（那邊沒有呼叫這個方法，走的是自己的 arc-walk 邏輯）。
  computeSphereUnits() {
    if (this._sphereUnits) return this._sphereUnits;
    const specialSet = new Set(this.specialIds);
    const specialList = this.nodeData.filter(d => specialSet.has(d.id));
    const regularList = this.nodeData.filter(d => !specialSet.has(d.id));
    const units = {};
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    // y 用「每格中心點」（(2i+1)/n）取樣，不是「首尾剛好落在 ±1 極點」的
    // (i/(n-1)) 版本（2026-08-02 修正）：兩組各自獨立套用同一條公式時，
    // (i/(n-1)) 版本會讓「第一個元素」跟「最後一個元素」不管 n 是多少，
    // y 都精確等於 +1／-1——兩個獨立分組的第一個元素永遠疊在同一個北極點、
    // 最後一個元素永遠疊在同一個南極點，跟該分組實際有幾個成員、theta 怎麼
    // 分佈完全無關（極點上 rAtY=0，theta 轉了也還是同一個點）。這正是使用者
    // 回報「台南咾咕石芳宅（一般節點組最後一個）」跟「原型獲獎（特殊節點組
    // 最後一個）」重疊的根本原因——實測過改之前這兩點角距離是 0.00°，改成
    // (2i+1)/n 之後兩組永遠不會剛好落在同一個極點，角距離變成 18.59°。
    const placeGroup = (list) => {
      const n = list.length;
      list.forEach((d, i) => {
        const y = 1 - (2 * i + 1) / n;
        const rAtY = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = goldenAngle * i;
        units[d.id] = { x: Math.cos(theta) * rAtY, y, z: Math.sin(theta) * rAtY };
      });
    };
    placeGroup(specialList);
    placeGroup(regularList);
    this._sphereUnits = units;
    return units;
  }

  // 把一個點依給定的 yaw（繞垂直軸）／pitch（繞水平軸）旋轉，回傳旋轉後的
  // 座標——純粹的旋轉「原語」，不管傳進來的是原始球面座標還是已經被校準層
  // 轉過一次的中間結果，都可以用同一個函式再轉一次（見 projectUnit()）。
  rotateProject(u, yaw, pitch) {
    const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
    const x1 = u.x * cosY + u.z * sinY;
    const z1 = -u.x * sinY + u.z * cosY;
    const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
    const y2 = u.y * cosP - z1 * sinP;
    const z2 = u.y * sinP + z1 * cosP;
    return { x: x1, y: y2, z: z2 };
  }

  // 把一個節點的原始球面座標投影成目前該畫在螢幕上的座標，套用兩層旋轉：
  // 先套「校準層」（_globeBaseYaw/_globeBasePitch，搜尋定位後固定不變），
  // 再套「自轉層」（_globeYaw/_globePitch，拖曳/閒置自轉持續改變）。z 是
  // 「面向使用者的程度」（+1 正對螢幕、-1 在球體背面），用來算深度相關的
  // 大小/透明度/文字顯示與否。沒有搜尋定位過的話 base 是 (0,0)，這一步是
  // 恆等變換，效果跟只套自轉層完全一樣（向下相容）。
  projectUnit(u) {
    const aligned = (this._globeBaseYaw === 0 && this._globeBasePitch === 0)
      ? u
      : this.rotateProject(u, this._globeBaseYaw, this._globeBasePitch);
    return this.rotateProject(aligned, this._globeYaw, this._globePitch);
  }

  // 解出一組 (yaw, pitch)，讓 rotateProject(該節點的球面座標, yaw, pitch)
  // 剛好落在 (0,-1,0)——畫面正中央「上方」、y 軸上的「北極點」（SVG 的 y
  // 座標往下遞增，screenY = cy + p.y·球半徑，所以 p.y=-1 對應畫面上緣，
  // 不是 +1；p.y=+1 會是「南極點」，落在畫面下緣）。
  //
  // ⚠️ 這組角度只能拿來當「校準層」（_globeBaseYaw/_globeBasePitch）用，
  // 不能直接疊到自轉層上：yaw 是繞 y 軸轉，「y 軸上的點不會因為 yaw 改變
  // 而移動」這件事，只在該點本身的座標滿足 x=z=0 時才成立——而這裡算出來
  // 的 (yaw,pitch) 只保證「這個節點被轉到 x=z=0、y=-1 的那一刻」，如果直接
  // 把這組角度當成之後會持續變動的自轉角度基準，节点球面座標一開始 x,z
  // 通常都不是 0，繼續改變角度時它就會沿著一個小緯度圈慢慢飄走，不會真的
  // 釘住（實測過，飄移約 10px／1.5 秒，不是完全靜止）。正確用法是當成
  // projectUnit() 的「校準層」：先用這組角度把目標點轉到北極點，之後的
  // 自轉層在「已經轉過校準層」的座標系裡對北極點做 yaw 旋轉，這時候北極點
  // 座標確實是 x=z=0，旋轉不動的性質才會成立。
  //
  // 推導：先選 yaw 讓旋轉後的 x 分量歸零（x1 = u.x·cosYaw + u.z·sinYaw = 0
  // 的其中一組解），再選 pitch 把剩下的 (y1,z1)（此時已經是單位向量）轉到
  // (-1,0)——先算出轉到 (1,0) 的角度，再加 π 剛好翻到反向。
  computeSpherePoseFor(nodeId) {
    const u = this.computeSphereUnits()[nodeId];
    if (!u) return null;
    const yaw0 = (Math.abs(u.x) < 1e-9 && Math.abs(u.z) < 1e-9) ? 0 : Math.atan2(-u.x, u.z);
    const x1 = u.x * Math.cos(yaw0) + u.z * Math.sin(yaw0);
    const z1 = -u.x * Math.sin(yaw0) + u.z * Math.cos(yaw0);
    const y1 = u.y;
    const pitch0 = Math.atan2(-z1, y1) + Math.PI;
    return { yaw: yaw0, pitch: pitch0 };
  }

  // 開始「飛到北極點」的補間動畫：把「校準層」（_globeBaseYaw/
  // _globeBasePitch）從目前值動畫到 computeSpherePoseFor() 算出的目標角度，
  // globeTick() 每影格推進；同時把「自轉層」的上下傾斜（_globePitch）一併
  // 補間回 0，讓飛到定位那一刻目標節點剛好落在畫面正上方置中，不會被飛行
  // 前使用者留下的傾斜角度帶偏。左右自轉（_globeYaw）完全不受影響、飛行中
  // 維持原樣繼續轉——反正自轉層是疊加在校準層「之上」的，北極點在校準後
  // 的座標系裡本來就是 x=z=0，yaw 轉多少都不影響它，不需要在飛行時特地
  // 暫停或歸零。base 角度會先換算成跟目前角度差距最小的等效角度（因為
  // 角度會一直累加、可能已經轉了很多圈），確保動畫走最短路徑，不會憑空
  // 多繞好幾圈或轉錯方向。
  startFlyTo(nodeId) {
    const pose = this.computeSpherePoseFor(nodeId);
    if (!pose) return;
    this._globeDragging = false;
    this._globeVelYaw = 0;
    const TWO_PI = Math.PI * 2;
    const kYaw = Math.round((this._globeBaseYaw - pose.yaw) / TWO_PI);
    const kPitch = Math.round((this._globeBasePitch - pose.pitch) / TWO_PI);
    this._globeFlyStartBaseYaw = this._globeBaseYaw;
    this._globeFlyStartBasePitch = this._globeBasePitch;
    this._globeFlyTargetBaseYaw = pose.yaw + kYaw * TWO_PI;
    this._globeFlyTargetBasePitch = pose.pitch + kPitch * TWO_PI;
    this._globeFlyStartSpinPitch = this._globePitch;
    this._globeFlyStartTime = performance.now();
    this._globeFlying = true;
  }

  // 算出手機版球體上每個節點「這一影格」該畫在哪、多大、標籤要不要顯示。
  // renderVals()（決定樣板初次/常規渲染的內容）跟 paintGlobe()（拖曳/慣性
  // 旋轉時繞過 setState、直接寫 DOM 屬性的高頻更新）共用同一份幾何計算，
  // 避免兩邊算法兜不起來、旋轉到一半又被另一邊的舊數字蓋回去。
  buildGlobeGeometry() {
    const cx = 450, cy = 450;
    // 雙指縮放：_globeZoom 乘進球半徑，等於整顆球（含節點大小、字級、標籤
    // 偏移）依同一個倍率放大/縮小，維持縮放時的視覺比例一致。
    const sphereR = this._GLOBE_SPHERE_RADIUS_VB * this._globeZoom;
    const baseFontSize = this._GLOBE_BASE_FONT_SIZE;
    const units = this.computeSphereUnits();
    const nodeRadiusMap = this.computeNodeRadiusMap();
    const zoom = this._globeZoom;
    const geo = {};
    this.nodeData.forEach(d => {
      const p = this.projectUnit(units[d.id]);
      // depthT: 0 = 球體最遠端、1 = 正對螢幕最近端。
      const depthT = (p.z + 1) / 2;
      const scale = (0.5 + depthT * 0.8) * zoom;
      const baseR = nodeRadiusMap[d.id] * this.dotScale;
      const r = baseR * scale;
      const screenX = cx + p.x * sphereR;
      const screenY = cy + p.y * sphereR;
      const isRight = p.x >= 0;
      const fontSize = Math.round(baseFontSize * Math.min(1.25, Math.max(0.8, scale)));
      const labelGap = 12 * zoom;
      const labelPointX = screenX + (isRight ? 1 : -1) * (r + labelGap);
      const isSpecial = this.specialIds.includes(d.id);
      geo[d.id] = {
        cx: screenX, cy: screenY, r, depthT, scale, isRight,
        fontSize, labelPointX, labelPointY: screenY,
        // 只給正面（面向螢幕這一側）的節點顯示文字——116 個節點的文字如果
        // 全部同時顯示在球面上，前後文字會疊成一團完全看不清楚；只顯示面向
        // 使用者這一側，效果比較接近「轉到面前才看得到標籤」的地球儀讀法。
        labelVisible: depthT > 0.72,
        hitR: Math.max(20, 30 * scale),
        // 手機版只有「章/成/法/構」這幾個分類大標節點可以點擊導覽，其餘
        // 一般節點只負責組成球體視覺，不接受點擊——見 renderVals() 裡
        // pointerEvents 的說明。
        clickable: isSpecial
      };
    });
    return geo;
  }

  // 同上，但算連線兩端點的螢幕座標跟「這條線該多透明」（越靠球體背面的連線
  // 越淡，維持「連線構成球體輪廓」的視覺，同時不會讓背面線條搶過正面內容）。
  buildGlobeEdgeGeometry() {
    const cx = 450, cy = 450;
    const sphereR = this._GLOBE_SPHERE_RADIUS_VB * this._globeZoom;
    const units = this.computeSphereUnits();
    return this.edgeData
      .map(([a, b], i) => {
        const ua = units[a], ub = units[b];
        if (!ua || !ub) return null;
        const pa = this.projectUnit(ua);
        const pb = this.projectUnit(ub);
        const avgDepth = (((pa.z + 1) / 2) + ((pb.z + 1) / 2)) / 2;
        return {
          id: 'e' + i, a, b,
          x1: cx + pa.x * sphereR, y1: cy + pa.y * sphereR,
          x2: cx + pb.x * sphereR, y2: cy + pb.y * sphereR,
          avgDepth
        };
      })
      .filter(Boolean);
  }

  // 建一次「節點 id -> DOM 元素」的對照表，讓 paintGlobe() 每一影格可以直接
  // 寫屬性，不用每次都重新 querySelector 一次全部節點/連線。因為 sc-for
  // 是用陣列索引當 React key（見 support.js 的 walkFor()），只要陣列長度、
  // 順序不變（桌機/手機兩種模式畫的都是固定 116 個節點、同樣的 edgeData），
  // 這些 DOM 元素在整個頁面生命週期裡不會被換掉，快取起來是安全的。
  //
  // 這個快取只有手機版會用到（paintGlobe() 開頭就對桌機 return），2026-07-31
  // 景深排序上線後，手機版每個節點在 DOM 裡其實有「背面層」「正面層」兩份
  // 完全一樣的元素（分別掛在標題 foreignObject 的前後，見樣板），同一時間
  // 只有一份的 display 不是 none——所以這裡改成幫每個節點存一對
  // `{ back, front }`，不是原本單一份。桌機版只有一份（`data-node="id"`，
  // 沒有 data-node-back/front），但反正 paintGlobe() 不會替桌機建這個快取，
  // 不用另外處理桌機分支。
  _ensureGlobeElCache() {
    if (this._globeElCache) return this._globeElCache;
    const cache = { nodes: {}, edges: {} };
    const collect = (group) => {
      if (!group) return null;
      return {
        group,
        hit: group.querySelector('circle'),
        dot: group.querySelector('[data-dot]'),
        // 樣板實際控制文字顯示/隱藏的是包住 foreignObject 的 <g data-label-wrap>
        // （`style="display:{{ node.labelDisplay }}"`），不是 foreignObject
        // 本身——paintGlobe() 要切換顯示/隱藏，一定要切這一層，見下面的說明。
        labelWrap: group.querySelector('[data-label-wrap]'),
        fo: group.querySelector('foreignObject'),
        div: group.querySelector('foreignObject div')
      };
    };
    this.nodeData.forEach(d => {
      const back = document.querySelector('[data-node-back="' + d.id + '"]');
      const front = document.querySelector('[data-node-front="' + d.id + '"]');
      if (!back && !front) return;
      cache.nodes[d.id] = { back: collect(back), front: collect(front) };
    });
    this.edgeData.forEach((_pair, i) => {
      const id = 'e' + i;
      const el = document.querySelector('[data-edge="' + id + '"]');
      if (el) cache.edges[id] = el;
    });
    this._globeElCache = cache;
    return cache;
  }

  // 拖曳／慣性旋轉時的高頻畫面更新——刻意不呼叫 setState()，直接改 DOM
  // 屬性，理由跟 tick()/startFlash() 一樣（見上面 field 宣告處的說明）。
  paintGlobe() {
    if (!this._effectiveIsMobile()) return;
    const nodeGeo = this.buildGlobeGeometry();
    const edgeGeo = this.buildGlobeEdgeGeometry();
    const cache = this._ensureGlobeElCache();

    // 幫「背面層」「正面層」兩份 DOM（見樣板、_ensureGlobeElCache() 的說明）
    // 寫完全一樣的幾何/樣式屬性——不管當下顯示的是哪一份，兩份的數字永遠
    // 同步，切換顯示的那一刻不會有「剛切過去、位置還沒更新」的閃爍。
    const applyToCopy = (copy, d, g) => {
      if (!copy) return;
      if (copy.dot) { copy.dot.setAttribute('cx', g.cx); copy.dot.setAttribute('cy', g.cy); copy.dot.setAttribute('r', g.r); }
      if (copy.hit) { copy.hit.setAttribute('cx', g.cx); copy.hit.setAttribute('cy', g.cy); copy.hit.setAttribute('r', g.hitR); }
      const depthOpacity = 0.15 + g.depthT * 0.85;
      if (copy.group) copy.group.style.opacity = String(depthOpacity);
      // ⚠️ 顯示/隱藏文字要切 labelWrap（樣板實際綁 node.labelDisplay 的那層
      // <g>），不是 fo（foreignObject）本身——之前錯把 display 切在
      // foreignObject 上，foreignObject 的 PARENT（labelWrap）第一次渲染時
      // 是什麼就永遠是什麼（paintGlobe() 從來沒更新過它），只要那層一開始
      // 是 display:none，不管 foreignObject 自己的 display 後來怎麼變，整包
      // 都還是被 parent 蓋住看不見。實際症狀：只有頁面剛載入那一刻剛好轉在
      // 正面的節點還能正常切換文字顯示/隱藏，其餘一開始就在背面的節點轉到
      // 正面後永遠不會出現文字——因為它們的 labelWrap 從掛載那一刻就被釘死
      // 在 display:none。2026-07-31 修正：改成每影格直接切 labelWrap 的
      // display，跟樣板初次渲染用的是同一層元素，兩邊不會再對不上。
      if (copy.labelWrap) copy.labelWrap.style.display = g.labelVisible ? '' : 'none';
      if (copy.fo) {
        // 跟 renderVals() 手機分支用同一個縮減後文字算寬度，避免兩邊算出的
        // boxW 對不上（框太寬、文字置中位置跟著跑掉）。
        const boxW = Math.max(140, (d.mobileName || d.name).length * g.fontSize + 16);
        const boxH = g.fontSize * 1.4 + 4;
        copy.fo.setAttribute('x', String(g.isRight ? g.labelPointX : g.labelPointX - boxW));
        copy.fo.setAttribute('y', String(g.labelPointY - boxH / 2));
        copy.fo.setAttribute('width', String(boxW));
        copy.fo.setAttribute('height', String(boxH));
      }
      if (copy.div) {
        copy.div.style.fontSize = g.fontSize + 'px';
        copy.div.style.textAlign = g.isRight ? 'left' : 'right';
      }
    };

    this.nodeData.forEach(d => {
      const g = nodeGeo[d.id];
      const els = cache.nodes[d.id];
      if (!g || !els) return;
      applyToCopy(els.back, d, g);
      applyToCopy(els.front, d, g);
      // 景深排序（2026-07-31 新增，見樣板／renderVals() 的說明）：depthT<=0.5
      // （球體後半）顯示「背面層」、隱藏「正面層」，反之亦然——門檻跟
      // renderVals() 算 backDisplay/frontDisplay 用的是同一個 0.5，兩邊要
      // 保持一致，否則旋轉時會在某個角度突然跳一下（初次渲染判定成正面，
      // 下一影格 paintGlobe() 卻判定成背面之類）。
      const isBack = g.depthT <= 0.5;
      if (els.back && els.back.group) els.back.group.style.display = isBack ? '' : 'none';
      if (els.front && els.front.group) els.front.group.style.display = isBack ? 'none' : '';
    });

    edgeGeo.forEach(e => {
      const el = cache.edges[e.id];
      if (!el) return;
      el.setAttribute('x1', String(e.x1));
      el.setAttribute('y1', String(e.y1));
      el.setAttribute('x2', String(e.x2));
      el.setAttribute('y2', String(e.y2));
      el.style.opacity = String(0.04 + e.avgDepth * 0.5);
    });
  }

  // 常駐的球體動畫迴圈：飛到北極點的動畫優先（見 startFlyTo()）；沒有在飛、
  // 也沒在拖曳時，讓拖曳當下的角速度用摩擦力慢慢衰減到 0，同時疊加一個很慢
  // 的閒置自轉，讓球體感覺「活著」而不是靜止的裝飾圖。桌機（viewportW >=
  // 768）不執行任何動作，只是每影格檢查一次，成本可以忽略。
  globeTick() {
    if (this._effectiveIsMobile()) {
      if (this._globeFlying) {
        const t = Math.min(1, (performance.now() - this._globeFlyStartTime) / this._globeFlyDuration);
        // easeInOutCubic：起步/收尾慢，中段快，比等速線性補間更像「飛過去」。
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        this._globeBaseYaw = this._globeFlyStartBaseYaw + (this._globeFlyTargetBaseYaw - this._globeFlyStartBaseYaw) * eased;
        this._globeBasePitch = this._globeFlyStartBasePitch + (this._globeFlyTargetBasePitch - this._globeFlyStartBasePitch) * eased;
        this._globePitch = this._globeFlyStartSpinPitch * (1 - eased);
        if (t >= 1) {
          this._globeBaseYaw = this._globeFlyTargetBaseYaw;
          this._globeBasePitch = this._globeFlyTargetBasePitch;
          this._globePitch = 0;
          this._globeFlying = false;
        }
        this.paintGlobe();
      } else if (!this._globeDragging) {
        this._globeVelYaw *= 0.94;
        if (Math.abs(this._globeVelYaw) < 0.0006) this._globeVelYaw = 0;
        const idleSpeed = 0.0022;
        this._globeYaw += this._globeVelYaw + idleSpeed;
        this.paintGlobe();
      }
    }
    this._globeRaf = requestAnimationFrame(() => this.globeTick());
  }

  handleSearchInput(e) {
    const query = e.target.value;
    this.setState({ searchInput: query });
    if (query.trim()) {
      // 手機版現在跟桌機一樣畫出全部 116 個節點（見 renderVals()），
      // 搜尋結果不需要再依 viewport 篩掉任何節點。
      const results = this.nodeData.filter(n => n.name.toLowerCase().includes(query.toLowerCase()));
      this.setState({ searchResults: results });
    } else {
      this.setState({ searchResults: [] });
    }
  }



  renderVals() {
    // Coordinate system is chosen to be ~1 viewBox unit ≈ 1 rendered CSS px
    // for the container's typical size, so font-size / radius values below
    // read as their literal px sizes on screen (not scaled down by the SVG).
    const cx = 450, cy = 450;
    // 手機／平板適配：斷點依實測結果選定——820px 平板寬度下頁首與圓環圖都已經正常，
    // 768px 也是常見 iPad portrait 寬度，所以窄於這個值才視為手機、套用放大過的最小尺寸。
    // 2026-08-02 新增手動切換鈕之後，這裡改成透過 _effectiveIsMobile()（有
    // 手動覆寫時優先採用手動選擇，否則才照原本的畫面寬度判斷）決定，不要
    // 再直接寫 `viewportW < 768`。
    const isMobile = this._effectiveIsMobile();
    // 全螢幕播放（2026-08-02 新增）：只在手機版有意義，跟 isMobile 一起看，
    // 避免「先手動切成桌機版，state 裡卻還留著 mobileFullscreenPlay:true」
    // 這種邊界情況讓桌機分支也被牽動到。
    const mobileFullscreenPlay = isMobile && this.state.mobileFullscreenPlay;
    const hoveredId = this.state.hoveredId;
    const isDarkMode = this.state.isDarkMode;
    const bgColor = isDarkMode ? 'oklch(0.15 0 0)' : 'oklch(0.99 0 0)';
    const textColor = isDarkMode ? 'oklch(0.95 0 0)' : 'oklch(0.16 0 0)';
    const lineColor = isDarkMode ? 'oklch(0.25 0 0)' : 'oklch(0.85 0 0)';
    const dotColor = isDarkMode ? 'oklch(0.95 0 0)' : 'oklch(0.16 0 0)';

    // Center title ("原型 × 未來" / "Architecture + Structure"). Desktop
    // keeps the original sizes/markup (foreignObject + div, text-align
    // centers the whole string as one block). Mobile (2026-08-02) instead
    // renders the title as three separate SVG <text> elements — see the
    // isMobile branch in the template — so the "×" glyph can be pinned
    // exactly on the sphere's projection center (cx,cy)（使用者要求「把X
    // 設定為球體的核心」），不是靠「原型」「未來」剛好等寬這種巧合讓 × 看起來
    // 大概在中間。字級也再縮小一半（使用者要求）。white-space:nowrap on the
    // desktop divs is what prevents the two lines from wrapping/drifting
    // apart in some mobile browsers（桌機分支沿用，跟這次調整無關）。
    const titleFontSize = isMobile ? 31 : 62;
    const subtitleFontSize = isMobile ? 11 : 22;
    const titleBoxWidth = 420;
    const titleBoxX = cx - titleBoxWidth / 2;
    // 手機版「× 是球心」排版用的座標：原型／未來分別靠右/靠左對齊、留出
    // 中間一小段給 ×，×本身用 text-anchor:middle 精確釘在 (cx,cy)。間距跟
    // 副標題的垂直位移都依目前字級等比例算，字級改變時排版還是合理。
    const titleCoreGap = titleFontSize * 0.6;
    const titleLeftX = cx - titleCoreGap;
    const titleRightX = cx + titleCoreGap;
    const titleSubtitleY = cy + titleFontSize * 0.9;

    // Every node from column B, in spreadsheet row order. Desktop/tablet
    // lays them out on a flat 2D ring around the center ("原型 × 未來");
    // mobile (2026-07-31) instead wraps them around a draggable 3D sphere
    // (see buildGlobeGeometry()/paintGlobe() above) — same node set, same
    // connection data, same degree-based sizing, just a different projection.
    // Node size scales with its connection count (degree) either way.
    const ordered = this.nodeData;
    const nodeRadius = this.computeNodeRadiusMap();

    const relatedIds = new Set();
    if (hoveredId) {
      relatedIds.add(hoveredId);
      this.edgeData.forEach(([a, b]) => {
        if (a === hoveredId) relatedIds.add(b);
        if (b === hoveredId) relatedIds.add(a);
      });
    }

    let nodes, edges, spotlight, hasSpotlight;

    if (isMobile) {
      // --- 3D 球體（手機版）---
      const nodeGeo = this.buildGlobeGeometry();
      nodes = ordered.map(d => {
        const g = nodeGeo[d.id];
        const dimmed = hoveredId && !relatedIds.has(d.id);
        const isSpecial = this.specialIds.includes(d.id);
        const fontWeight = isSpecial ? 700 : 400;
        const isHoveredSelf = hoveredId === d.id;
        const specialColor = (!isDarkMode && isHoveredSelf) ? '#000000' : (isDarkMode ? '#BDA434' : '#9B9B9B');
        const dotFill = isSpecial ? specialColor : dotColor;
        const labelColor = isSpecial ? specialColor : textColor;
        // 手機版球體用縮減過的 mobileName（有的話），桌機/搜尋結果一律維持
        // 原本完整的 name 不變（見 nodeData 宣告處 2026-07-31 新增的
        // mobileName 欄位）。
        const displayName = d.mobileName || d.name;
        const boxW = Math.max(140, displayName.length * g.fontSize + 16);
        const boxH = g.fontSize * 1.4 + 4;
        const depthOpacity = 0.15 + g.depthT * 0.85;
        // 景深排序（2026-07-31 新增）：球體後半（depthT<=0.5）只顯示「背面層」
        // 那份 DOM、隱藏「正面層」那份，反之亦然——兩層分別畫在置中標題的
        // DOM 位置前後（見樣板），這樣後半的節點會被標題蓋住、前半的節點會
        // 蓋在標題上面，看起來標題真的嵌在球心。門檻用 0.5（也就是 z=0，
        // 球體正對觀察者的赤道切面）而不是 labelVisible 用的 0.72，因為這裡
        // 要分的是「整顆球的前半/後半」，不是「多靠近正面才要顯示文字」，
        // 兩個門檻各司其職、刻意不共用。
        const isBack = g.depthT <= 0.5;
        return {
          id: d.id,
          name: displayName,
          href: d.href,
          cx: g.cx,
          cy: g.cy,
          r: g.r,
          hitR: g.hitR,
          boxX: g.isRight ? g.labelPointX : g.labelPointX - boxW,
          boxY: g.labelPointY - boxH / 2,
          boxW,
          boxH,
          textAlign: g.isRight ? 'left' : 'right',
          fontSize: g.fontSize,
          fontWeight,
          dotFill,
          labelColor,
          // 3D 球體上的文字一律水平放置，不像 2D 圓環那樣沿半徑旋轉——旋轉
          // 0 度等於不轉，跟桌機共用同一個樣板屬性。
          rotateDeg: 0,
          pivotX: g.labelPointX,
          pivotY: g.labelPointY,
          opacity: (dimmed ? 0.3 : 1) * depthOpacity,
          labelDisplay: g.labelVisible ? 'block' : 'none',
          backDisplay: isBack ? '' : 'none',
          frontDisplay: isBack ? 'none' : '',
          // 手機版只有章/成/法/構這幾個分類大標節點可以點擊導覽子頁，其餘
          // 一般（小）節點只負責組成球體視覺——116 個節點擠在一顆小球上，
          // 大部分小點轉到背面時完全看不到文字，誤觸的機率很高、又點不到
          // 想要的頁面，乾脆讓它們單純不接受點擊。用 pointer-events:none
          // 蓋在最外層的 <a> 上，整個子樹（含 <a> 自己）都不會再吃到滑鼠/
          // 觸控事件。桌機不受影響，全部節點照常可以點擊。
          // 例外：目前被搜尋標註（黃色亮點）的節點一律恢復可點擊，就算它
          // 本來是不可點的小節點——搜尋定位後使用者理應能直接點這個點進
          // 子頁，不是只能點旁邊冒出來的地標 icon（見 ensureLandmark()）。
          // 全螢幕播放時（2026-08-02 新增）這條例外也要一起關掉——使用者
          // 要求全螢幕播放期間「無法使用任何功能（跳轉子網頁、搜尋等等）
          // 只能轉動球體」，不能因為剛好有節點還留著搜尋標註就開了一個
          // 可以點出去的後門。
          pointerEvents: (!mobileFullscreenPlay && (g.clickable || d.id === this.state.flashId)) ? 'auto' : 'none',
          cursorStyle: (!mobileFullscreenPlay && (g.clickable || d.id === this.state.flashId)) ? 'pointer' : 'default',
          onEnter: () => this.setHover(d.id),
          onLeave: () => this.clearHover()
        };
      });

      edges = this.buildGlobeEdgeGeometry().map(e => {
        const dimmed = hoveredId && !(hoveredId === e.a || hoveredId === e.b);
        const depthOpacity = 0.04 + e.avgDepth * 0.5;
        return {
          id: e.id, x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2,
          opacity: dimmed ? 0.1 : depthOpacity
        };
      });

      // 球體會自轉、使用者也能拖著轉，光暈這種假設「固定朝中央」的平面裝飾
      // 效果套在會動的 3D 球體上會很奇怪（原型結構轉到背面時，光暈仍然是
      // 一條攤平的線，看起來會像穿透球體），手機版直接不畫。
      spotlight = null;
      hasSpotlight = false;
    } else {
      // --- 2D 圓環（桌機／平板，邏輯與數值完全未變）---
      const n = ordered.length;
      const dotScale = this.dotScale;
      const gapVB = 2.5;

      const diameterSum = ordered.reduce((sum, d) => sum + 2 * nodeRadius[d.id], 0);
      const circumference = diameterSum + n * gapVB;
      // Keep the ring well clear of the center "原型 × 未來" title regardless
      // of how tightly the nodes would otherwise pack.
      const radius = Math.max(circumference / (2 * Math.PI), 420);
      // Once radius is clamped up, re-derive the per-node gap so the arc walk
      // below still sums to exactly 2π·radius — otherwise the ring doesn't close.
      const effectiveGapVB = (2 * Math.PI * radius - diameterSum) / n;

      const positions = {};
      let arcPos = 0;
      ordered.forEach(d => {
        const r = nodeRadius[d.id];
        const angle = ((arcPos + r) / radius) - Math.PI / 2;
        positions[d.id] = {
          x: cx + radius * Math.cos(angle),
          y: cy + radius * Math.sin(angle),
          angle
        };
        arcPos += 2 * r + effectiveGapVB;
      });

      // Soft "spotlight" glow cast from the 原型結構 dot toward the center
      // title — same visual read as the existing connecting lines, just an
      // added faint glow layer. Narrow at the dot, widening as it reaches the
      // title so it reads as light spreading over distance.
      spotlight = null;
      const spotlightSrc = positions['r23'];
      if (spotlightSrc) {
        const dirX = cx - spotlightSrc.x, dirY = cy - spotlightSrc.y;
        const len = Math.hypot(dirX, dirY) || 1;
        const ux = dirX / len, uy = dirY / len;
        const perpX = -uy, perpY = ux;
        const coneLen = len + 170;
        const halfWidth = 230;
        const baseX = spotlightSrc.x + ux * coneLen, baseY = spotlightSrc.y + uy * coneLen;
        const leftX = baseX + perpX * halfWidth, leftY = baseY + perpY * halfWidth;
        const rightX = baseX - perpX * halfWidth, rightY = baseY - perpY * halfWidth;
        spotlight = {
          points: spotlightSrc.x + ',' + spotlightSrc.y + ' ' + leftX + ',' + leftY + ' ' + rightX + ',' + rightY,
          x1: spotlightSrc.x, y1: spotlightSrc.y, x2: baseX, y2: baseY,
          color: isDarkMode ? '#FFFFFF' : '#EDEDED',
          peakOpacity: isDarkMode ? 0.045 : 0.55
        };
      }
      hasSpotlight = !!spotlight;

      const boxH = 20;
      nodes = ordered.map(d => {
        const pos = positions[d.id];
        const r = nodeRadius[d.id];
        const gap = 20;
        const isRight = Math.cos(pos.angle) >= 0;
        const labelPointX = pos.x + Math.cos(pos.angle) * (r + gap);
        const labelPointY = pos.y + Math.sin(pos.angle) * (r + gap);
        const angleDeg = pos.angle * 180 / Math.PI;
        const rotateDeg = isRight ? angleDeg : angleDeg + 180;
        const dimmed = hoveredId && !relatedIds.has(d.id);
        const fontSize = 15;
        const isSpecial = this.specialIds.includes(d.id);
        const fontWeight = isSpecial ? 700 : 400;
        const isHoveredSelf = hoveredId === d.id;
        const specialColor = (!isDarkMode && isHoveredSelf) ? '#000000' : (isDarkMode ? '#BDA434' : '#9B9B9B');
        const dotFill = isSpecial ? specialColor : dotColor;
        const labelColor = isSpecial ? specialColor : textColor;
        // Size the box to comfortably fit the text (worst-case full-width CJK
        // glyphs) so nowrap text never overflows its box — overflow can shift
        // where the text-align anchor edge (the end nearest the node) actually
        // lands, breaking the otherwise-uniform node-to-label gap.
        const boxW = Math.max(160, d.name.length * fontSize + 20);
        return {
          id: d.id,
          name: d.name,
          href: d.href,
          cx: pos.x,
          cy: pos.y,
          r: r * dotScale,
          hitR: 26,
          boxX: isRight ? labelPointX : labelPointX - boxW,
          boxY: labelPointY - boxH / 2,
          boxW,
          boxH,
          textAlign: isRight ? 'left' : 'right',
          fontSize,
          fontWeight,
          dotFill,
          labelColor,
          rotateDeg,
          pivotX: labelPointX,
          pivotY: labelPointY,
          opacity: dimmed ? 0.3 : 1,
          labelDisplay: 'block',
          pointerEvents: 'auto',
          cursorStyle: 'pointer',
          onEnter: () => this.setHover(d.id),
          onLeave: () => this.clearHover()
        };
      });

      edges = this.edgeData
        .filter(([a, b]) => positions[a] && positions[b])
        .map(([a, b], i) => {
          const pa = positions[a], pb = positions[b];
          const dimmed = hoveredId && !(hoveredId === a || hoveredId === b);
          return {
            id: 'e' + i,
            x1: pa.x, y1: pa.y,
            x2: pb.x, y2: pb.y,
            opacity: dimmed ? 0.3 : 1
          };
        });
    }

    // 手機版頁尾收合成一個 Contact 按鈕（2026-07-31 新增）。`{{ }}` 樣板不
    // 支援三元運算子／邏輯運算子（見「已知的資料相依細節」那節的說明），
    // 這裡先把展開箭頭要不要轉向、按鈕邊框色、內文淡色、社群圖示底色都算
    // 成單純變數，不要在樣板裡直接寫 `{{ isDarkMode ? ... : ... }}`。
    const footerContactChevronDeg = this.state.showFooterContact ? 180 : 0;
    const footerContactBorderColor = isDarkMode ? 'oklch(0.4 0 0)' : 'oklch(0.6 0 0)';
    const footerMutedColor = isDarkMode ? 'oklch(0.7 0 0)' : 'oklch(0.4 0 0)';
    const footerSocialBg = isDarkMode ? 'oklch(0.25 0 0)' : 'oklch(0.9 0 0)';

    return {
      nodes, edges, bgColor, textColor, lineColor, dotColor, isDarkMode,
      spotlight, hasSpotlight,
      isMobile,
      footerContactChevronDeg, footerContactBorderColor, footerMutedColor, footerSocialBg,
      showFooterContact: this.state.showFooterContact,
      toggleFooterContact: () => this.toggleFooterContact(),
      headerPadding: isMobile ? '16px 16px' : '24px 40px',
      // 手機版整個頁面（最外層那個 div）改成 flex column，讓 #works 用
      // flex-grow 吃掉頁首（position:fixed，不佔 flex 空間）跟頁尾之間的
      // 剩餘高度——2026-07-31 修正，使用者回報「好像有一個框架罩住主視覺」，
      // 確認是指球體容器（data-globe-surface）本身的裁切邊界，要求上緣貼齊
      // 頁首下緣、下緣貼齊頁尾上緣。桌機/平板維持原本的 block 版面，不受影響。
      pageDisplay: isMobile ? 'flex' : 'block',
      pageFlexDirection: 'column',
      // #works 的上邊距只需要清開固定定位的頁首——用 Playwright 實測頁首
      // 實際高度是 96px（`headerPadding` 16px 上下 + 內容最高的深色模式
      // 切換鈕 44px），第一版抓 80px 短了 16px，球體裁切框上緣會被頁首蓋掉
      // 一截，改成精確的 96px，貼齊頁首下緣。不再像桌機那樣留 450px 的大量
      // 留白；下邊距歸零，讓 flex-grow 自己把剩餘空間吃滿到頁尾正上方。
      worksPaddingTop: isMobile ? '96px' : '450px',
      worksPaddingBottom: isMobile ? '0px' : '450px',
      worksDisplayMode: isMobile ? 'flex' : 'block',
      worksFlexGrow: isMobile ? '1' : '0',
      // data-globe-surface 現在是「裁切框」本身，手機版撐滿 #works 的全部
      // 高度（也就是頁首下緣到頁尾上緣這整段），球體視覺（下面新增的內層
      // `<div>`，寬高仍是原本那組 diagramContainerWidth 算出來的正方形）
      // 用 flex 置中在這個裁切框正中央——這樣裁切邊界比視覺球體本身大
      // 很多，旋轉/縮放時的安全邊界更寬，同時裁切框的上下緣精確貼齊頁首/
      // 頁尾。桌機/平板這個框跟視覺球體是同一塊大小（height:auto、
      // display:block，讓外層直接收縮包住內層的正方形），跟改動前完全一樣。
      //
      // ⚠️ 手機版原本寫 height:100%，實測發現這個百分比在這層巢狀 flex
      // 結構裡會靜默解析失敗（#works 是 display:flex、預設 flex-direction:
      // row，data-globe-surface 是它唯一的 flex item——即使 #works 本身有
      // 明確的算出高度，data-globe-surface 的 height:100% 還是解析不出來，
      // 瀏覽器退回用「內容自己的高度」撐開，也就是內層那個正方形本身的
      // 高度，比 #works 實際可用高度矮很多）。用 Playwright 直接量測
      // getBoundingClientRect() 確認過：height:100% 時裁切框只有 363px 高
      // （幾乎等於正方形本身的邊長），但 #works 實際可用高度是 636px——
      // 裁切框沒有撐滿，球體因此整個往上偏、下面留一大截空白，這正是
      // 2026-07-31 使用者回報「主視覺位置偏高」的根本原因。改成 height:auto
      // 後，靠 #works 預設的 align-items:normal（在 flex 容器裡等同
      // stretch）把 data-globe-surface 撐滿剩餘高度，不需要百分比解析，
      // 量測確認裁切框變回 636px、精確貼齊頁首下緣到頁尾上緣，球體置中在
      // 正中央。桌機版本來就是 'auto'，這次改完手機/桌機這個值統一，直接
      // 拿掉三元判斷。
      globeSurfaceHeight: 'auto',
      globeSurfaceDisplay: isMobile ? 'flex' : 'block',
      diagramContainerWidth: isMobile ? 'min(92vw, 88vh)' : 'min(90vw, 86vh)',
      globeOverflow: isMobile ? 'hidden' : 'visible',
      edgeStrokeWidth: isMobile ? 2 : 1,
      // 3D 球體用 paintGlobe() 每影格直接寫 cx/cy/r/opacity 等屬性做旋轉動畫，
      // 如果 CSS transition 還留著，每一次直接寫入都會被拖著跑 0.25s 的緩動，
      // 反而讓拖曳跟手感變得黏滯、有延遲；手機版直接關掉這兩個 transition。
      nodeTransition: isMobile ? 'none' : 'opacity 0.25s ease',
      edgeTransition: isMobile ? 'none' : 'opacity 0.25s ease, stroke 0.3s',
      // 拖曳/縮放球體時不要讓瀏覽器把手勢當成「頁面捲動/放大頁面」搶走。
      globeTouchAction: isMobile ? 'none' : 'auto',
      // 全螢幕播放（2026-08-02 新增）：data-globe-surface 從 #works 裡的一個
      // 裁切框改成直接蓋滿整個 viewport（position:fixed; inset:0）——不用
      // 額外調整 diagramContainerWidth 的公式，因為它本來就是用 vw/vh 算的，
      // 容器本身變成全螢幕後，同一條公式自然就會撐出更大的球體，不需要為
      // 全螢幕另外寫一組數值。z-index 給 500，蓋過 #works（2）但不用蓋過
      // 頁首（1000）/搜尋列（1001）——頁首整個隱藏了，這兩個在全螢幕播放期間
      // 根本不會出現，唯一需要蓋過球體的只有下面的退出鈕（1500）。
      globeSurfacePosition: mobileFullscreenPlay ? 'fixed' : 'static',
      globeSurfaceInset: mobileFullscreenPlay ? '0' : 'auto',
      globeSurfaceZIndex: mobileFullscreenPlay ? 500 : 'auto',
      globeSurfaceBg: mobileFullscreenPlay ? bgColor : 'transparent',
      mobileFullscreenPlay,
      // 頁首整個隱藏（不是只隱藏部分按鈕）——搜尋、漢堡選單、深淺模式、
      // 裝置切換全部在頁首裡，藏起頁首本身最簡單也最保險，不用逐一確認
      // 每個按鈕都被擋掉。用 display:none（不是 sc-if 卸載），元素還在但
      // 不吃任何互動、也不佔版面，跟其他既有的 display 切換模式一致。
      headerDisplay: mobileFullscreenPlay ? 'none' : 'flex',
      // 手機版頁尾（Contact 按鈕）同理，全螢幕播放時不該還能點開。
      showMobileFooter: isMobile && !mobileFullscreenPlay,
      enterMobileFullscreenPlay: () => this.enterMobileFullscreenPlay(),
      exitMobileFullscreenPlay: () => this.exitMobileFullscreenPlay(),
      titleBoxX, titleBoxWidth, titleFontSize, subtitleFontSize,
      titleLeftX, titleRightX, titleSubtitleY,
      searchBoxDisplay: isMobile ? 'none' : 'flex',
      navPillGap: isMobile ? '12px' : '32px',
      navPillPadding: isMobile ? '10px 12px' : '16px 24px',
      showMobileSearchBar: isMobile && this.state.showMobileSearch,
      showMobileSearch: this.state.showMobileSearch,
      toggleMobileSearch: () => this.toggleMobileSearch(),
      closeMobileSearch: () => this.closeMobileSearch(),
      toggleDarkMode: () => this.toggleDarkMode(),
      toggleDeviceMode: () => this.toggleDeviceMode(),
      showMaterialMenu: this.state.showMaterialMenu,
      toggleMaterialMenu: () => this.toggleMaterialMenu(),
      searchResults: this.state.searchResults.map(r => ({ id: r.id, name: r.name, go: () => this.goToNode(r.id) })),
      hasResults: this.state.searchResults.length > 0,
      searchInput: this.state.searchInput,
      handleSearchInput: (e) => this.handleSearchInput(e),
      setHover: (id) => this.setHover(id),
      goToNode: (id) => this.goToNode(id)
    };
  }
}

</script>

<!-- PAGE TRANSITION PRELOADER (homepage -> subpage) -->
<script>
(function () {
  // 快速跳字詞彙池（活頁簿1 C 欄粗體字，不含目的頁標題，由點擊的節點動態決定終點文字）
  var WORD_POOL = [
    '章architecturedesign', '原型教學', '原型原點', '原型結構', '木構造', '竹構造',
    'RC構造', '鋼構造', '成construction', '法structuredata', '構technics',
    '原型建築', '原型獲獎'
  ];
  var FLICKER_MS = 130;
  var LANDING_HOLD_MS = 550;
  var OVERLAY_BG = '#0a0a0a';
  var TEXT_COLOR = '#ffffff';
  var FADE_IN_MS = 250;

  var overlay, wordEl, navigating = false;

  function ensureOverlay() {
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:' + OVERLAY_BG + ';display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(0);transition:opacity ' + FADE_IN_MS + 'ms ease;';
    wordEl = document.createElement('span');
    wordEl.style.cssText = "font-family:'Noto Serif TC','Source Han Serif TC',serif;font-size:15px;font-weight:800;letter-spacing:.08em;color:" + TEXT_COLOR + ";white-space:nowrap;";
    overlay.appendChild(wordEl);
    document.body.appendChild(overlay);
  }

  function playAndNavigate(destinationWord, href) {
    ensureOverlay();
    overlay.style.pointerEvents = 'auto';
    wordEl.textContent = WORD_POOL[0];
    requestAnimationFrame(function () { overlay.style.opacity = '1'; });

    var sequence = WORD_POOL.concat([destinationWord]);
    var i = 0;
    function flicker() {
      wordEl.textContent = sequence[i];
      i++;
      if (i < sequence.length) {
        setTimeout(flicker, FLICKER_MS);
      } else {
        setTimeout(function () {
          try { sessionStorage.setItem('scTransitionIn', '1'); } catch (err) {}
          window.location.href = href;
        }, LANDING_HOLD_MS);
      }
    }
    flicker();
  }

  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest && e.target.closest('a[href$=".dc.html"]');
    if (!a || navigating) return;
    var href = a.getAttribute('href');
    if (!href || /^https?:\/\//i.test(href)) return;
    e.preventDefault();
    navigating = true;
    var labelEl = a.querySelector('div');
    var destinationWord = labelEl ? labelEl.textContent.trim() : '';
    playAndNavigate(destinationWord || '原型教學', href);
  });

  // 瀏覽器上一頁按鈕修正：從子頁按「上一頁」回到首頁時，瀏覽器常會直接從
  // bfcache 還原這個頁面當時「即將跳轉」的畫面快照——也就是遮罩還蓋在畫面上、
  // 還沒滑開的那個瞬間，導致看起來像卡在前導動畫。用 pageshow 偵測 bfcache
  // 還原（event.persisted），還原時直接把遮罩清掉、重置狀態，讓首頁正常顯示。
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    navigating = false;
    if (overlay) {
      overlay.remove();
      overlay = null;
    }
  });
})();
</script>
