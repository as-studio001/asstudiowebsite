<!-- INTRO VIDEO OVERLAY（遷入形式參照 final原型結構ASstudio首頁_standalone.html 的做法：
     全螢幕影片覆蓋層，播完（或發生錯誤/逾時保險）就淡出移除，讓底下的網站內容顯露出來） -->
<div id="sc-intro-overlay" style="position:fixed; inset:0; z-index:99999; background:#ffffff; display:flex; align-items:center; justify-content:center; transition:opacity 0.6s ease;">
  <video id="sc-intro-video" autoplay muted playsinline preload="auto" style="width:100%; height:100%; object-fit:cover;">
    <source src="uploads/網頁前導片.mp4" type="video/mp4">
  </video>
</div>
<script>
(function () {
  var overlay = document.getElementById('sc-intro-overlay');
  var vid = document.getElementById('sc-intro-video');
  if (!overlay || !vid) return;

  // 開場影片只在「真正從瀏覽器進入網站」時播一次：用 sessionStorage 記一個
  // 「這個分頁這次工作階段已經播過」的旗標，只要旗標存在，不管是點子頁連結
  // 回首頁、按瀏覽器上一頁（不管有沒有吃到 bfcache）、或重新整理，一律不重播。
  // 分頁關閉、或使用者直接開新分頁進站，sessionStorage 會是空的，才會再播一次。
  var SESSION_KEY = 'sc_introPlayed';
  try {
    if (sessionStorage.getItem(SESSION_KEY)) {
      overlay.remove();
      return;
    }
    sessionStorage.setItem(SESSION_KEY, '1');
  } catch (err) {
    // sessionStorage 被瀏覽器封鎖（例如嚴格隱私模式）時，退回用 referrer 判斷：
    // 同網域、且不是首頁自己，視為從站內子頁過來，一樣不播。
    try {
      if (document.referrer) {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin && ref.pathname !== location.pathname) {
          overlay.remove();
          return;
        }
      }
    } catch (err2) {}
  }

  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    overlay.style.opacity = '0';
    setTimeout(function () { overlay.remove(); }, 600);
  }

  vid.addEventListener('ended', reveal);
  // 影片無法播放（格式不支援、載入失敗等）就直接顯露頁面，不要卡住
  vid.addEventListener('error', reveal);
  // 保險：萬一瀏覽器封鎖自動播放、ended/error 都沒觸發，逾時也要顯露頁面
  setTimeout(reveal, 15000);
})();
</script>

    <div data-globe-surface="1" style="width:100%; height:{{ globeSurfaceHeight }}; display:{{ globeSurfaceDisplay }}; align-items:center; justify-content:center; touch-action:{{ globeTouchAction }}; overflow:{{ globeOverflow }}; position:{{ globeSurfacePosition }}; inset:{{ globeSurfaceInset }}; z-index:{{ globeSurfaceZIndex }}; background-color:{{ globeSurfaceBg }};">
    <div style="width:{{ diagramContainerWidth }}; max-width:2000px; margin:0 auto; aspect-ratio:1/1; flex-shrink:0;">
    <svg data-globe-svg="1" viewBox="0 0 900 900" width="100%" height="100%" style="overflow: visible; fill: #930707; transition: transform 0.4s ease;">
        <sc-if value="{{ hasSpotlight }}" hint-placeholder-val="{{ false }}">
          <defs>
            <linearGradient id="spotlightGrad" gradientUnits="userSpaceOnUse" x1="{{ spotlight.x1 }}" y1="{{ spotlight.y1 }}" x2="{{ spotlight.x2 }}" y2="{{ spotlight.y2 }}">
              <stop offset="0%" stop-color="{{ spotlight.color }}" stop-opacity="0"></stop>
              <stop offset="55%" stop-color="{{ spotlight.color }}" stop-opacity="{{ spotlight.peakOpacity }}"></stop>
              <stop offset="100%" stop-color="{{ spotlight.color }}" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          <polygon points="{{ spotlight.points }}" fill="url(#spotlightGrad)" style="pointer-events:none;"></polygon>
        </sc-if>
        <sc-for list="{{ edges }}" as="edge" hint-placeholder-count="10">
          <line data-edge="{{ edge.id }}" x1="{{ edge.x1 }}" y1="{{ edge.y1 }}" x2="{{ edge.x2 }}" y2="{{ edge.y2 }}" stroke="{{ lineColor }}" stroke-width="{{ edgeStrokeWidth }}" style="opacity: {{ edge.opacity }}; transition: {{ edgeTransition }};"></line>
        </sc-for>

        <!-- 桌機 2D 圓環：單一層，跟改景深排序之前完全一樣，不受下面手機版
             雙層拆分影響（見 renderVals() isMobile 分支的說明）。 -->
        <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{ nodes }}" as="node" hint-placeholder-count="14">
            <a href="{{ node.href }}" style="cursor:{{ node.cursorStyle }}; pointer-events:{{ node.pointerEvents }};">
              <g data-node="{{ node.id }}" onMouseEnter="{{ node.onEnter }}" onMouseLeave="{{ node.onLeave }}" style="opacity: {{ node.opacity }}; transition: {{ nodeTransition }};">
                <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.hitR }}" fill="transparent"></circle>
                <circle data-dot="{{ node.id }}" cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.r }}" fill="{{ node.dotFill }}" style="transition:fill 0.3s;"></circle>
                <g data-label-wrap="1" transform="rotate({{ node.rotateDeg }} {{ node.pivotX }} {{ node.pivotY }})" style="display:{{ node.labelDisplay }};">
                  <foreignObject x="{{ node.boxX }}" y="{{ node.boxY }}" width="{{ node.boxW }}" height="{{ node.boxH }}" style="overflow:visible;">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:{{ node.fontSize }}px; font-weight:{{ node.fontWeight }}; line-height:1.4; font-family:'Helvetica Neue',Helvetica,Arial,'PingFang TC','Microsoft JhengHei',sans-serif; color:{{ node.labelColor }}; text-align:{{ node.textAlign }}; white-space:nowrap; pointer-events:auto; transition:color 0.3s;">{{ node.name }}</div>
                  </foreignObject>
                </g>
              </g>
            </a>
          </sc-for>
        </sc-if>

        <!-- 手機 3D 球體：節點拆成「背面層」（畫在標題*之前*，會被標題蓋住）
             跟「正面層」（畫在標題*之後*，蓋在標題上面）兩份完全一樣的
             sc-for，同一個 node 每影格只有一份 display 是可見的（見
             paintGlobe() 的 depthT<=0.5 判斷），讓「原型×未來」標題視覺上
             像是嵌在球心——2026-07-31 新增，修正「圓點轉過標題時看不出
             前後關係」的問題。data-node-back／data-node-front 是
             _ensureGlobeElCache() 用來分別抓兩份 DOM 的專屬屬性，跟桌機版
             沿用的 data-node 是不同的選取器，兩邊不會互相干擾。 -->
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{ nodes }}" as="node" hint-placeholder-count="14">
            <a href="{{ node.href }}" style="cursor:{{ node.cursorStyle }}; pointer-events:{{ node.pointerEvents }};">
              <g data-node="{{ node.id }}" data-node-back="{{ node.id }}" onMouseEnter="{{ node.onEnter }}" onMouseLeave="{{ node.onLeave }}" style="display:{{ node.backDisplay }}; opacity: {{ node.opacity }}; transition: {{ nodeTransition }};">
                <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.hitR }}" fill="transparent"></circle>
                <circle data-dot="{{ node.id }}" cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.r }}" fill="{{ node.dotFill }}" style="transition:fill 0.3s;"></circle>
                <g data-label-wrap="1" transform="rotate({{ node.rotateDeg }} {{ node.pivotX }} {{ node.pivotY }})" style="display:{{ node.labelDisplay }};">
                  <foreignObject x="{{ node.boxX }}" y="{{ node.boxY }}" width="{{ node.boxW }}" height="{{ node.boxH }}" style="overflow:visible;">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:{{ node.fontSize }}px; font-weight:{{ node.fontWeight }}; line-height:1.4; font-family:'Helvetica Neue',Helvetica,Arial,'PingFang TC','Microsoft JhengHei',sans-serif; color:{{ node.labelColor }}; text-align:{{ node.textAlign }}; white-space:nowrap; pointer-events:auto; transition:color 0.3s;">{{ node.name }}</div>
                  </foreignObject>
                </g>
              </g>
            </a>
          </sc-for>
        </sc-if>

        <!-- 桌機版標題：foreignObject + 置中的 div，逐字未變。 -->
        <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
          <foreignObject x="{{ titleBoxX }}" y="350" width="{{ titleBoxWidth }}" height="200" style="overflow:visible; pointer-events:none;">
            <div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;">
              <div style="font-size:{{ titleFontSize }}px; font-weight:600; letter-spacing:0.02em; color:{{ textColor }}; font-family:'Noto Serif TC','Source Han Serif TC',serif; white-space:nowrap; transition:color 0.3s;">{{ centerTitleCombined }}</div>
              <div style="font-size:{{ subtitleFontSize }}px; letter-spacing:0.06em; color:{{ textColor }}; opacity:0.55; margin-top:10px; white-space:nowrap; transition:color 0.3s;">Architecture + Structure</div>
            </div>
          </foreignObject>
        </sc-if>

        <!-- 手機版標題：拆成三個獨立的 SVG <text>，「×」用 text-anchor:middle
             精確釘在球體投影中心 (cx,cy)（2026-08-02 新增，使用者要求「把X
             設定為球體的核心」）；「原型」/「未來」分別靠右/靠左對齊在 ×
             兩側，不依賴兩者剛好等寬這種巧合。字級也再縮小一半。
             2026-08-04：曾經一度把整塊（含背光暈）搬到全部節點畫完之後、
             變成整個 SVG 最上層，想解決標題被節點蓋住看不見的問題，但使用者
             體驗後回報「看不出來原型未來是在球核，反而會擋住正面移動經過的
             圓點」——會蓋過正面節點，等於整個推翻第十二次調整「正面節點蓋
             過標題、標題蓋過背面節點」這個刻意營造「嵌在球心」立體感的設計，
             改回原本夾在「背面節點層」跟「正面節點層」中間的位置。標題偶爾
             被正面節點蓋住視為可接受的代價（維持嵌入球心的立體感優先於標題
             隨時 100% 可讀），下面的背光暈保留，至少把背面連線/節點透出來
             的雜訊擦乾淨，緩解使用者更早之前回報的「原型未來消失了」問題。 -->
        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <!-- 標題背光暈：先用頁面背景色（跟著深色模式變）往外羽化透明的
               放射狀漸層圓，把標題所在的這一小塊區域「擦」乾淨，文字才不會
               跟背面那層連線/節點混在一起分不清楚——正面節點還是會照常蓋在
               光暈跟標題上面，不受影響。 -->
          <defs>
            <radialGradient id="titleGlowGrad" gradientUnits="userSpaceOnUse" cx="{{ titleAnchorX }}" cy="450" r="{{ titleGlowRadius }}">
              <stop offset="0%" stop-color="{{ bgColor }}" stop-opacity="0.95"></stop>
              <stop offset="55%" stop-color="{{ bgColor }}" stop-opacity="0.85"></stop>
              <stop offset="100%" stop-color="{{ bgColor }}" stop-opacity="0"></stop>
            </radialGradient>
          </defs>
          <circle cx="{{ titleAnchorX }}" cy="450" r="{{ titleGlowRadius }}" fill="url(#titleGlowGrad)" style="pointer-events:none; transition:fill 0.3s;"></circle>
          <!-- data-center-title-left/right 的文字內容是用 _syncCenterTitleText()
               在 componentDidMount()/componentDidUpdate() 裡直接寫 textContent，
               不是用 {{ }} 內插——DC 模板引擎對「已解析出字串」的 {{ }} 一律會
               包一層 <span class="sc-interp">（見 support.js walkText()，跟串流
               載入時顯示 placeholder 有關，沒有可以關掉的選項），SVG <text> 的
               內容模型不接受這種非 SVG 命名空間的子元素，包了 span 之後這兩個
               翻譯文字直接整個不會畫出來——這正是使用者回報「手機版中的原型
               未來消失了」的根本原因之一（× 跟副標題是固定字面文字、沒有走
               {{ }} 內插，所以沒有這個問題，只有這兩個真的需要換語言的文字
               才中招）。改成模板裡留空、掛一個穩定的 data-* 選取器，由 JS
               直接寫 textContent，繞開這個限制。 -->
          <text x="{{ titleAnchorX }}" y="450" text-anchor="middle" dominant-baseline="central" style="font-size:{{ titleFontSize }}px; font-weight:600; letter-spacing:0.02em; fill:{{ textColor }}; font-family:'Noto Serif TC','Source Han Serif TC',serif; transition:fill 0.3s; pointer-events:none;">×</text>
          <text data-center-title-left="1" x="{{ titleLeftX }}" y="450" text-anchor="end" dominant-baseline="central" style="font-size:{{ titleFontSize }}px; font-weight:600; letter-spacing:0.02em; fill:{{ textColor }}; font-family:'Noto Serif TC','Source Han Serif TC',serif; transition:fill 0.3s; pointer-events:none;"></text>
          <text data-center-title-right="1" x="{{ titleRightX }}" y="450" text-anchor="start" dominant-baseline="central" style="font-size:{{ titleFontSize }}px; font-weight:600; letter-spacing:0.02em; fill:{{ textColor }}; font-family:'Noto Serif TC','Source Han Serif TC',serif; transition:fill 0.3s; pointer-events:none;"></text>
          <text x="450" y="{{ titleSubtitleY }}" text-anchor="middle" dominant-baseline="central" style="font-size:{{ subtitleFontSize }}px; letter-spacing:0.06em; fill:{{ textColor }}; opacity:0.55; transition:fill 0.3s; pointer-events:none;">Architecture + Structure</text>
        </sc-if>

        <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{ nodes }}" as="node" hint-placeholder-count="14">
            <a href="{{ node.href }}" style="cursor:{{ node.cursorStyle }}; pointer-events:{{ node.pointerEvents }};">
              <g data-node="{{ node.id }}" data-node-front="{{ node.id }}" onMouseEnter="{{ node.onEnter }}" onMouseLeave="{{ node.onLeave }}" style="display:{{ node.frontDisplay }}; opacity: {{ node.opacity }}; transition: {{ nodeTransition }};">
                <circle cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.hitR }}" fill="transparent"></circle>
                <circle data-dot="{{ node.id }}" cx="{{ node.cx }}" cy="{{ node.cy }}" r="{{ node.r }}" fill="{{ node.dotFill }}" style="transition:fill 0.3s;"></circle>
                <g data-label-wrap="1" transform="rotate({{ node.rotateDeg }} {{ node.pivotX }} {{ node.pivotY }})" style="display:{{ node.labelDisplay }};">
                  <foreignObject x="{{ node.boxX }}" y="{{ node.boxY }}" width="{{ node.boxW }}" height="{{ node.boxH }}" style="overflow:visible;">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:{{ node.fontSize }}px; font-weight:{{ node.fontWeight }}; line-height:1.4; font-family:'Helvetica Neue',Helvetica,Arial,'PingFang TC','Microsoft JhengHei',sans-serif; color:{{ node.labelColor }}; text-align:{{ node.textAlign }}; white-space:nowrap; pointer-events:auto; transition:color 0.3s;">{{ node.name }}</div>
                  </foreignObject>
                </g>
              </g>
            </a>
          </sc-for>
        </sc-if>
      </svg></div></div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hoveredId: null, isDarkMode: false, showSearchModal: false, searchInput: '', searchResults: [], flashId: null, showMaterialMenu: false, viewportW: (typeof window !== 'undefined' ? window.innerWidth : 1200), showMobileSearch: false, showFooterContact: false, forcedMode: null, mobileFullscreenPlay: false, currentLang: null, showLanguageMenu: false };

  // 頁首新增的手機/電腦版手動切換鈕（2026-08-02）：`forcedMode` 是 null 時，
  // 完全比照原本的行為，單純依 viewportW 是否小於 768 判斷；使用者按過
  // 切換鈕之後變成 'mobile' 或 'desktop'，之後不管視窗多寬都固定用這個
  // 手動選擇的模式，直到再按一次切換鈕或重新整理頁面（forcedMode 是
  // instance state，不寫進 localStorage，重新整理會回到依畫面尺寸判斷）。
  // 這個檔案裡原本散落在好幾個地方（componentDidMount 的事件監聽器、
  // goToNode()、tick()、globeTick()、paintGlobe()、renderVals()）各自直接
  // 寫 `this.state.viewportW < 768`／`>= 768` 判斷手機/桌機——新增這個手動
  // 覆寫功能後，這些地方全部要改成呼叫這個方法，不能只改 renderVals()
  // 那一處，否則會出現「畫面看起來是手機版，但拖曳/搜尋/自轉等互動邏輯
  // 還是照桌機規則跑」這種樣板跟邏輯對不上的狀況。
  _effectiveIsMobile() {
    if (this.state.forcedMode != null) return this.state.forcedMode === 'mobile';
    return this.state.viewportW < 768;
  }

  toggleDeviceMode() {
    const next = this._effectiveIsMobile() ? 'desktop' : 'mobile';
    // 手動切換模式會讓 isMobile 的 sc-if 分支整個卸載/重新掛載（手機版的
    // data-node-back/data-node-front 節點群組、地標相關 DOM 都是全新的
    // 元素，不是同一批），_globeElCache（見 _ensureGlobeElCache()）快取的
    // 卻是切換前那批已經被移除的舊元素，且這個快取只會建立一次、之後永遠
    // 不會自動重建。不清掉的話，paintGlobe() 會繼續埋頭更新那些已經不在
    // 畫面上的舊元素，畫面上真正顯示的新元素則永遠停在剛掛載那一刻的位置
    // ——症狀是「切換幾次之後球體卡住不會轉」（2026-08-02 使用者回報並
    // 修正）。清掉快取讓 _ensureGlobeElCache() 下次呼叫時重新查詢，抓到
    // 這次掛載的新元素。
    this._globeElCache = null;
    this.setState({ forcedMode: next });
  }

  // Node names and hrefs from uploaded spreadsheet (活頁簿1-24674e73.xlsx):
  // Column B provides the node names, Column A provides the target URLs.
  // Category/section-header nodes get a fixed accent color and bold weight
  // regardless of light/dark mode. Each entry maps a node id to its color.
  specialIds = ['r1', 'r101', 'r2', 'r15', 'r28', 'r23', 'r115', 'r59', 'r100', 'r109'];

  // 主視覺多語系（2026-08-03 新增）：可切換的語言清單，每個 { code, label }
  // 由「D:\2026as實習\網頁\圓點位置編輯器.html」的語言管理功能手動維護，
  // 再跟 specialIds／nodeData／edgeData 一樣，用複製貼上同步過來——這裡
  // 不是自動同步，是同一套既有的手動同步流程多一個區塊。每個 nodeData
  // 項目可以有一個 `translations: { code: '翻譯後文字', ... }` 欄位（同樣
  // 由編輯器維護、同步進 nodeData 陣列本身，不是另外開一個陣列），沒有
  // 翻譯的語言/節點會自動退回顯示原文（見 renderVals() 的 translatedName()）。
  // 空陣列＝目前還沒有任何翻譯，語言切換鈕會只顯示「中文（原文）」一個選項。
  languages = [    { code: 'en', label: "English" },
    { code: 'zh-Hans', label: "簡體中文" },
    { code: 'fr', label: "Français" },
    { code: 'ja', label: "日本語" },
    { code: 'ko', label: "한국어" },
    { code: 'es', label: "Español" }];

  // 球心「原型 × 未來」標題的多語系（2026-08-04 新增，同日一度改回原文、
  // 隨後使用者要求連同溢出問題一起重做）：跟 nodeData[].translations 不
  // 一樣，這不是編輯器管理的節點資料，是固定的頁面裝飾文字，所以直接寫死
  // 在這裡，不走編輯器同步流程。key 要跟上面 languages 的 code 對上；沒有
  // 對應語言（或原文/中文）一律照舊顯示「原型」／「未來」，見
  // getCenterTitle()。翻譯後字串長度不一（英文「Prototype × Future」比
  // 中文「原型 × 未來」寬很多），實際顯示的字級會依長度動態縮小，見
  // renderVals() 裡 estimateTitleWidth() 那段說明，不是在這裡手動調位置。
  centerTitleTranslations = {
    en: { left: 'Prototype', right: 'Future' },
    'zh-Hans': { left: '原型', right: '未来' },
    fr: { left: 'Prototype', right: 'Futur' },
    ja: { left: 'プロトタイプ', right: '未来' },
    ko: { left: '프로토타입', right: '미래' },
    es: { left: 'Prototipo', right: 'Futuro' }
  };

  // Shared by both the desktop 2D ring and the mobile 3D globe (renderVals()
  // and buildGlobeGeometry()/paintGlobe() below) so a dot's "visual weight"
  // bump is defined in exactly one place.
  dotScale = 1.18;

  // 手機版 3D 球體：球半徑（viewBox 單位）、節點文字基準字級、目前的旋轉角度
  // （yaw 繞垂直軸、pitch 繞水平軸，單位皆為弧度）跟拖曳/慣性狀態。這幾個是
  // instance field（不是 state）——旋轉是由 paintGlobe()/globeTick() 每一影格
  // 直接寫 DOM 屬性驅動，刻意不透過 setState()，避免 60fps 都觸發一次完整的
  // reconcile（跟 tick()/startFlash() 現有的「動畫用原生 DOM、不用 setState」
  // 是同一個理由）。renderVals() 依然會讀這幾個 field 來算初次渲染的位置，
  // 所以就算中途因為別的原因（例如切換深色模式）觸發了一次正常的 re-render，
  // 畫出來的位置也是「目前轉到哪」，不會跳回初始角度。
  _GLOBE_SPHERE_RADIUS_VB = 260;
  _GLOBE_BASE_FONT_SIZE = 15;
  // 預設角度 0/0，旋轉完全交給使用者拖曳/閒置自轉決定。
  _globeYaw = 0;
  _globePitch = 0;
  _globeVelYaw = 0;
  _globeDragging = false;
  _globeDragDist = 0;
  _globeLastX = 0;
  _globeLastY = 0;
  // 雙指縮放：_globeZoom 是縮放倍率（1 = 預設大小），乘進
  // buildGlobeGeometry()/buildGlobeEdgeGeometry() 的螢幕座標、圓點半徑、字級
  // 計算裡（見這兩個方法）。_globeActivePointers 記錄目前放在螢幕上的每根
  // 手指（Map: pointerId -> {x,y}），兩根手指同時按著時才進入縮放模式。
  _globeZoom = 1;
  _GLOBE_ZOOM_MIN = 0.55;
  _GLOBE_ZOOM_MAX = 2.6;
  _globeActivePointers = new Map();
  _globePinching = false;
  _globePinchStartDist = 0;
  _globePinchStartZoom = 1;
  // ⚠️ 搜尋「飛到北極點」需要把旋轉拆成兩層，不能只靠 _globeYaw/_globePitch
  // 一組角度就做到——這是實作時繞了一次彎才發現的，記下來避免以後重踩：
  // 「_globeYaw 持續增加、y 軸上的點不會動」這個性質，只在該點的*原始*球面
  // 座標本身就滿足 x=z=0 時成立（也就是只有 Fibonacci sphere 排列時天生在
  // 兩極的 r1/r116）——對任何其他（絕大多數）節點，就算算出一組 (yaw0,
  // pitch0) 讓它「這一刻」剛好轉到北極點畫面座標，只要 yaw 繼續變動，它就會
  // 沿著一個小緯度圈慢慢飄走，不會真的釘住（實測：搜尋後等 1.5 秒，目標點
  // 還是飄了近 10px，不是完全不動）。
  //
  // 正確做法是兩層旋轉合成：_globeBaseYaw/_globeBasePitch 是「校準」層——
  // 搜尋時算一次、之後固定不變，把整顆球轉到「目標節點剛好在北極點」的
  // 姿勢；_globeYaw/_globePitch 維持原本的意義（自轉/拖曳），但現在是疊加在
  // 校準層*之上*的旋轉——疊加後再對北極點 (0,-1,0) 做 yaw 旋轉，這次才真的
  // 對，因為北極點在「校準後的座標系」裡本來就是 x=z=0。沒有搜尋過（或還
  // 沒點過搜尋結果）時 base 是 (0,0) 单位矩陣，行為跟以前完全一樣。
  // renderVals()/buildGlobeGeometry() 用 projectUnit() 這個方法做兩層合成，
  // 不要繞過它直接呼叫 rotateProject() 兩次自己兜。
  _globeBaseYaw = 0;
  _globeBasePitch = 0;

  // 搜尋後「飛到北極點」動畫：goToNode() 呼叫 startFlyTo() 時算出目前
  // base 到目標校準角度的補間終點，globeTick() 每影格用 easing 往目標推進
  // _globeBaseYaw/_globeBasePitch；同時把 _globePitch（自轉的上下傾斜）
  // 一併補間回 0，確保飛到定位那一刻，目標節點剛好落在畫面正上方置中，
  // 不會被使用者飛行前留下的傾斜角度帶偏。_globeYaw（左右自轉）不受影響、
  // 飛行中維持不變，飛完後繼續正常自轉——見上面 _globeYaw 為什麼不用重置。
  _globeFlying = false;
  _globeFlyStartBaseYaw = 0;
  _globeFlyStartBasePitch = 0;
  _globeFlyTargetBaseYaw = 0;
  _globeFlyTargetBasePitch = 0;

  _globeFlyStartSpinPitch = 0;
  _globeFlyStartTime = 0;
  _globeFlyDuration = 700;
